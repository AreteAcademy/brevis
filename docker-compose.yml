# Phase 0's local environment: Postgres + the API, nothing else.
#
# `docker compose up` has to leave GET /health and GET /ready answering, which is
# the phase's completion criterion (section 39 of the plan).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brevis
      POSTGRES_PASSWORD: brevis
      POSTGRES_DB: brevis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # The API only starts once the database accepts a connection — without
      # this the first start fails on a race, and compose ends up in a confusing
      # restart loop.
      test: ["CMD-SHELL", "pg_isready -U brevis -d brevis"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    command: ["migrate", "up"]
    environment:
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      target: api
    command: ["serve"]
    environment:
      BREVIS_ENV: local
      BREVIS_HTTP_ADDR: ":8080"
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
      # The local interface is OPEN. Outside BREVIS_ENV=local the process refuses
      # to start without a credential, but here it listens on your own machine,
      # and asking for a password on every `make up` would only teach the team to
      # turn authentication off.
      #
      # To see the sign-in screen, generate a hash with `brevis hash`, uncomment
      # the three lines and restart:
      BREVIS_AUTH_USUARIO: operador
      BREVIS_AUTH_SENHA_HASH: "pbkdf2-sha256$600000$6ewhY/AG9eqZFyl4FOWz9Q$pGUKCVCWTALSTafMdeS2f8UXS9hNyZRsK9/tlWpzbgU"
      BREVIS_AUTH_SEGREDO: "segredo-local-de-desenvolvimento-com-32-bytes"
    ports: ["8080:8080"]
    # The customer's visual identity. Commented out because the default
    # installation has no file at all — uncomment after copying
    # `brand.example.yaml` to `brand.yaml`. Read-only: the API never writes to
    # it.
    # volumes:
    #   - ./brand.yaml:/etc/brevis/brand.yaml:ro
    # environment also needs BREVIS_BRAND_FILE: /etc/brevis/brand.yaml
    depends_on:
      postgres: {condition: service_healthy}
      # Migrate before serving: the API does not apply the schema, by decision
      # (see postgres.Migrate).
      migrate: {condition: service_completed_successfully}

  # Without this service the local stack ACCEPTS work and never executes it: the
  # "run now" button creates the Run, it goes into the queue and stays there
  # forever. The API executes nothing by decision (section 37: whoever creates is
  # not whoever executes), so somebody has to consume the queue — and this is
  # that somebody.
  scheduler:
    build:
      context: .
      target: worker
    command: ["scheduler", "--interval", "5s", "--concurrency", "4"]
    environment:
      BREVIS_ENV: local
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
