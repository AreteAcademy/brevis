# Phase 0's local environment: Postgres + the API, nothing else.
#
# `docker compose up` has to leave GET /health and GET /ready answering, which is
# the phase's completion criterion (section 39 of the plan).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brevis
      POSTGRES_PASSWORD: brevis
      POSTGRES_DB: brevis
    # The published port is overridable, and the default is unchanged.
    #
    # A developer machine very often already has something on 5432 -- another
    # project's Postgres, or one that is merely PAUSED, which still holds the
    # binding. `make up` then fails on a conflict that has nothing to do with
    # this repository, and the message names a container the reader has never
    # heard of.
    #
    #     export BREVIS_PG_PORT=55433
    #
    # EXPORTED rather than prefixing one command: the Makefile derives DB_URL
    # and TEST_DB_URL from the same variable, and a stack moved here with
    # `make test-int` still on 5432 would point at whatever else answers --
    # which is a stranger's database rather than a conflict that fails.
    #
    # docker-compose.drivers.yml solved the same problem by moving to 55432 and
    # writing down why; this keeps 5432 for everybody whose tooling points at
    # it, and gives a way out to everybody else.
    ports: ["${BREVIS_PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # The API only starts once the database accepts a connection — without
      # this the first start fails on a race, and compose ends up in a confusing
      # restart loop.
      test: ["CMD-SHELL", "pg_isready -U brevis -d brevis"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      target: api
    command: ["migrate", "up"]
    environment:
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      target: api
    command: ["serve"]
    environment:
      BREVIS_ENV: local
      BREVIS_HTTP_ADDR: ":8080"
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
      # The local interface is OPEN, and these three lines are commented for
      # that reason. Outside BREVIS_ENV=local the process refuses to start
      # without a credential; here it listens on your own machine, and asking
      # for a password on every `make up` would only teach the team to turn
      # authentication off.
      #
      # They were NOT commented, so the file did the opposite of what this
      # paragraph says: `make up` gave a sign-in screen whose password nobody
      # had. The hash is pbkdf2 at 600,000 iterations and the plaintext was
      # never written down anywhere, so it was not a password anybody could
      # look up -- it was a locked door with no key.
      #
      # To get the sign-in screen back, make a hash of your own and uncomment:
      #
      #     go run ./cmd/brevis hash
      #
      # `$$` is compose's escape for a literal `$`. Without it compose reads
      # `$600000` and what follows as variables and substitutes blanks, so the
      # hash reaching the process is not the one written here -- which is the
      # second reason that sign-in could never have worked.
      #
      # BREVIS_AUTH_USER: operador
      # BREVIS_AUTH_PASSWORD_HASH: "pbkdf2-sha256$$600000$$...$$..."
      # BREVIS_AUTH_SECRET: "a local development secret of 32 bytes"
      #
      # OR LET `make up-data` FILL THESE FROM THE ENVIRONMENT. Empty is the
      # same as absent -- `Credential.Enabled()` wants both a user and a hash
      # -- so the default below is exactly the open console described above,
      # and nothing here changes until something exports them.
      #
      # A value arriving through the environment needs NO `$$` escaping: that
      # rule is about what compose substitutes inside this file, and a hash
      # full of `$` passes through untouched. It is the opposite trap from
      # the one four paragraphs up, and both have cost somebody an afternoon.
      BREVIS_AUTH_USER: ${BREVIS_AUTH_USER:-}
      BREVIS_AUTH_PASSWORD_HASH: ${BREVIS_AUTH_PASSWORD_HASH:-}
      BREVIS_AUTH_SECRET: ${BREVIS_AUTH_SECRET:-}
      #
      # THE DATA TOOLS: the Preview and Query tabs on a destination.
      #
      # Commented for a different reason than the three lines above, and it
      # needs them: the tabs are drawn only on a console that asks who you
      # are. An unauthenticated console must not hand out every table in the
      # warehouse, so uncommenting this line alone does nothing, and the API
      # says so at boot rather than leaving you to wonder.
      #
      # `host.docker.internal` because `brevis-sql serve` runs on YOUR
      # machine and not in this stack: it holds a warehouse credential, and
      # nothing in this file should.
      #
      #     cd sql && go run ./cmd/brevis-sql serve
      #
      # `make up-data` sets it; by hand it is the line below.
      #
      #     BREVIS_SQL_SERVE_URL: http://host.docker.internal:8088
      BREVIS_SQL_SERVE_URL: ${BREVIS_SQL_SERVE_URL:-}
      BREVIS_SQL_SERVE_TOKEN: ${BREVIS_SQL_SERVE_TOKEN:-}
    ports: ["${BREVIS_API_PORT:-8080}:8080"]
    # The customer's visual identity. Commented out because the default
    # installation has no file at all — uncomment after copying
    # `brand.example.yaml` to `brand.yaml`. Read-only: the API never writes to
    # it.
    # volumes:
    #   - ./brand.yaml:/etc/brevis/brand.yaml:ro
    # environment also needs BREVIS_BRAND_FILE: /etc/brevis/brand.yaml
    depends_on:
      postgres: {condition: service_healthy}
      # Migrate before serving: the API does not apply the schema, by decision
      # (see postgres.Migrate).
      migrate: {condition: service_completed_successfully}

  # Without this service the local stack ACCEPTS work and never executes it: the
  # "run now" button creates the Run, it goes into the queue and stays there
  # forever. The API executes nothing by decision (section 37: whoever creates is
  # not whoever executes), so somebody has to consume the queue — and this is
  # that somebody.
  scheduler:
    build:
      context: .
      target: worker
    command: ["scheduler", "--interval", "5s", "--concurrency", "4"]
    environment:
      BREVIS_ENV: local
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
      BREVIS_LOG_LEVEL: debug
      # WHAT A STEP IS ALLOWED TO SEE. Without a list here a step gets PATH
      # and HOME and nothing else -- inheriting the environment would hand
      # the database's credential to every step of every pipeline.
      BREVIS_TASK_ENV: DATA_DIR,WAREHOUSE_DSN
      DATA_DIR: /data
      # The warehouse by its CONTAINER address: a step runs in this network,
      # and `brevis-sql serve` on the host reaches the same database by
      # localhost. One database, two addresses, which is what a host-side
      # service and a container both needing it means.
      WAREHOUSE_DSN: postgres://brevis:brevis@warehouse:5432/warehouse?sslmode=disable
    volumes:
      # Where `demo-build` put the project's binaries, and the data its steps
      # read and write. Both are EMPTY until the demo profile has run, and an
      # empty mount costs a plain `make up` nothing.
      #
      # The data is bind-mounted and not a named volume: the point of the
      # example is that you open the files afterwards and see what each step
      # wrote.
      - demobin:/opt/brevis/bin:ro
      - ${BREVIS_DATA:-./examples/full-pipeline/data}:/data
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # THE WAREHOUSE, AND IT IS NOT THE ENGINE'S DATABASE.
  #
  # `postgres` above holds runs, landings and schedules -- the control plane.
  # Customer data landing in it would blur the one line this product sells:
  # the engine orchestrates and never touches what the pipelines move. A
  # service of its own makes that visible in `docker compose ps`, gives it its
  # own DSN and its own volume, and lets `docker compose stop warehouse` leave
  # the console standing.
  #
  # It is reached by TWO ADDRESSES, which is what a host-side service and a
  # container both needing it means: `warehouse:5432` from the steps and the
  # gateway, `localhost:${BREVIS_WAREHOUSE_PORT}` from `brevis-sql serve`,
  # which runs on the host because it holds a warehouse credential.
  warehouse:
    profiles: ["demo"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brevis
      POSTGRES_PASSWORD: brevis
      POSTGRES_DB: warehouse
    ports: ["${BREVIS_WAREHOUSE_PORT:-55434}:5432"]
    volumes:
      - warehousedata:/var/lib/postgresql/data
      # Runs ONCE, on an empty volume. `make up-data` applies the same file
      # again every time, because editing DDL on an existing warehouse would
      # otherwise do nothing at all.
      - ./examples/full-pipeline/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brevis -d warehouse"]
      interval: 2s
      timeout: 3s
      retries: 15

  # A LOCAL PROJECT TO LOOK AT, and the two one-shots that put it there.
  #
  # The stack above is the PLATFORM and ships with nothing in it: an empty
  # console is correct for a product whose workflows belong to whoever
  # installs it. It is useless for `make up-data`, which exists so somebody
  # can SEE the thing working, so these publish a real project into it.
  #
  # `examples/full-pipeline` by default, because it is the one that already
  # exercises every shape the engine has -- for_each, unless_empty, markers,
  # retries -- and it carries its own data. Point the three variables
  # somewhere else and it is YOUR project instead.
  #
  # BOTH BEHIND A PROFILE, so `make up` is exactly what it was: a platform
  # with nothing in it. `docker compose run` reaches a profiled service
  # without turning the profile on, which is how the Makefile orders them.
  demo-build:
    profiles: ["demo"]
    image: golang:1.27
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
    # Alpine: a dynamically linked binary lands in the runtime image and
    # fails with "not found", which reads as a missing file and is a missing
    # ELF interpreter.
    command: ["go", "build", "-o", "/out/", "./cmd/..."]
    volumes:
      - ${BREVIS_PIPELINE:-./examples/full-pipeline/pipeline}:/src:ro
      - demobin:/out
      - gocache:/root/.cache/go-build
      - gomod:/go/pkg/mod
    restart: "no"

  # `uses:` is expanded HERE, at publish: a child has to be in the same
  # publish, and expansion that read the database would make `brevis validate`
  # answer a different question from this one.
  demo-publish:
    profiles: ["demo"]
    build:
      context: .
      target: api
    command: ["publish", "/workflows"]
    environment:
      BREVIS_DATABASE_URL: postgres://brevis:brevis@postgres:5432/brevis?sslmode=disable
    volumes:
      - ${BREVIS_WORKFLOWS:-./examples/full-pipeline/workflows}:/workflows:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: "no"

  # The ingestion gateway, and the Pub/Sub emulator it lands into.
  #
  # It shares NOTHING with the services above: no database, no queue, no
  # migration. That is the design rather than an omission -- the engine
  # orchestrates and never touches customer data, and this does nothing else. It
  # is here so `docker compose up` gives the whole product on one machine, not
  # because the two are coupled.
  #
  # Which also means it has nothing in the console. See docs/GATEWAY.md.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >-
      gcloud beta emulators pubsub start
      --project=brevis-local --host-port=0.0.0.0:8085
    # PUBLISHED ON 55085 AND NOT 8085, which stays the emulator's own port
    # inside the network -- the mapping's right-hand side never changes.
    #
    # `gcloud auth login` sends the browser to `http://localhost:8085/` and
    # waits there for the authorization code. With this stack up the callback
    # reached the emulator instead, and the login hung and then failed with
    # `(missing_code) Missing code parameter in response`: a developer locked
    # out of their own cloud by a container they had forgotten was running.
    # The high range is what BREVIS_WAREHOUSE_PORT already uses, for this.
    ports: ["${BREVIS_PUBSUB_PORT:-55085}:8085"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8085/v1/projects/brevis-local/topics || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Creates the topic the gateway publishes to. The driver never creates one --
  # a topic is infrastructure and belongs to whoever owns it -- so somebody has
  # to, and locally that is this.
  topic:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    entrypoint: ["sh", "-ec"]
    command:
      - |
        # Idempotent, because `docker compose up` runs twice. The emulator
        # answers 409 for a topic that already exists, and `curl -f` turns that
        # into a failure -- so a second `up` broke on a state that was fine.
        # Reading the status code instead of asking curl to judge it.
        B=http://pubsub:8085/v1/projects/brevis-local

        T=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$$B/topics/clicks")
        echo "topic: $$T"
        [ "$$T" = 200 ] || [ "$$T" = 409 ] || exit 1

        S=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$$B/subscriptions/clicks-sub" \
             -H 'Content-Type: application/json' \
             -d '{"topic":"projects/brevis-local/topics/clicks"}')
        echo "subscription: $$S"
        [ "$$S" = 200 ] || [ "$$S" = 409 ] || exit 1

        echo "topic and subscription ready"
    depends_on:
      pubsub: {condition: service_healthy}

  gateway:
    build:
      context: .
      # gateway-example and not gateway: the config below names the
      # `enrich_clicks` hook, which only gateway/example compiles in. The
      # published image registers no hooks. See the Dockerfile and issue #68.
      target: gateway-example
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: brevis-local
      # Local, so the endpoint is open -- the same rule the api follows above,
      # and for the same reason: asking for a token on every `make up` only
      # teaches a team to turn authentication off. Outside local the gateway
      # refuses to start without `listen.auth`.
      BREVIS_ENV: local
      # The warehouse by its CONTAINER address, the same one the steps use.
      # The `orders` stream names this variable; the file never holds the
      # string.
      WAREHOUSE_DSN: postgres://brevis:brevis@warehouse:5432/warehouse?sslmode=disable
    ports:
      - "${BREVIS_GATEWAY_PORT:-8090}:8080"
      # The exposition, on its own port because it is on its own listener: the
      # ingest port is public by design and a /metrics on it would publish
      # every stream name and destination.
      - "${BREVIS_GATEWAY_METRICS_PORT:-9091}:9090"
    volumes:
      - ./gateway/example/gateway.local.yaml:/etc/brevis/gateway.yaml:ro
      # The dead letter, on a volume. Inside the image it would die with the
      # container, which is a slower way of losing the events it exists to keep.
      - deadletter:/var/dead-letter
    depends_on:
      topic: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  # The warehouse's data, apart from the engine's: two volumes because they
  # are two databases with two jobs, and `docker compose down -v` on one
  # should not be a decision about the other.
  warehousedata:
  # The demo project's compiled binaries and the Go caches that build them.
  # Named rather than bind-mounted: nothing here is meant to be read by hand,
  # and a bind mount of /root/.cache into a repository is a mess nobody asked
  # for.
  demobin:
  gocache:
  gomod:
  pgdata:
  deadletter:
