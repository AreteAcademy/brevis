{{- include "brevis.validate" . -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brevis.fullname" . }}-db
  labels: {{- include "brevis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (not .Values.auth.existingSecret) (or (ne .Values.env "local") .Values.auth.user) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brevis.fullname" . }}-auth
  labels: {{- include "brevis.labels" . | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.auth.user | quote }}
  # The hash, never the password. `brevis hash` produces it.
  passwordHash: {{ .Values.auth.passwordHash | quote }}
  secret: {{ .Values.auth.secret | quote }}
{{- end }}
{{- if and .Values.slack.webhook (not .Values.slack.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brevis.fullname" . }}-slack
  labels: {{- include "brevis.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook: {{ .Values.slack.webhook | quote }}
{{- end }}
