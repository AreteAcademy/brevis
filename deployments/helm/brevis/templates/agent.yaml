{{/*
The agent: a runtime you keep, for steps that use `host:` instead of `image:`.

OFF BY DEFAULT, and that is the honest position rather than a cautious one.
This is the engine's chart, and the agent is deliberately NOT part of the
engine's lifecycle: it is the pod YOU keep, very often in another namespace,
owned by another team, built FROM our image with your own runtime on top. A
release that upgraded your dbt runtime because the engine shipped a patch would
be exactly the coupling `host:` exists to avoid.

It is here because a first one has to come from somewhere and a client wanting
to try the mode should not have to write a StatefulSet. When it becomes more
than that, it belongs in a release of its own.

A StatefulSet and not a Deployment: with more than one replica the engine has
to come back to the instance that took the work, because the agent keeps a ring
and a process handle in its own memory. That needs per-pod DNS, which is what a
StatefulSet with a governing headless Service gives and a Deployment does not.
*/}}
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brevis.fullname" . }}-agent
  labels:
    {{- include "brevis.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  # Headless: this exists for the per-pod DNS names, not for load balancing.
  clusterIP: None
  # A draining pod keeps its DNS name, so the engine can still resume the step
  # it handed over; without it a terminating pod drops out of DNS at SIGTERM.
  # See deployments/kubernetes/agent.yaml (#136).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "brevis.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
  ports:
    - {name: http, port: 9443, targetPort: 9443}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "brevis.fullname" . }}-agent
  labels:
    {{- include "brevis.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  serviceName: {{ include "brevis.fullname" . }}-agent
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "brevis.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "brevis.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      # How long a drain may last. Kubernetes' 30s default would cut it (#136).
      terminationGracePeriodSeconds: {{ .Values.agent.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        {{- if .Values.agent.state.persistent }}
        # A claimed volume comes up owned by root, and the agent runs as 65532:
        # without this its state would fail to write, and that failure is only
        # a warning. OnRootMismatch, so a full volume is not walked every start.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{ .Values.agent.image | default (printf "%s:%s-agent" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:9443
            {{- if .Values.agent.tokenSecret }}
            - --token-file=/etc/brevis/token
            {{- else }}
            # Only reachable with agent.insecureNoToken, which the validations
            # make somebody type.
            - --insecure-no-token
            {{- end }}
            # Where to come back to, built from THIS pod's name. Without it a
            # second replica is a step failed at the first network blip, with
            # the process still running on the replica that has it.
            - --advertise=http://$(POD_NAME).{{ include "brevis.fullname" . }}-agent.$(POD_NAMESPACE).svc:9443
            {{- with .Values.agent.allowSecrets }}
            - --secrets-dir=/etc/brevis/secrets
            - --allow-secrets={{ join "," . }}
            {{- end }}
            - --state-dir=/var/lib/brevis-agent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports: [{name: http, containerPort: 9443}]
          # Readiness, not liveness: it paces the rollout, and a liveness
          # failure would SIGTERM a pod holding a running step. See
          # deployments/kubernetes/agent.yaml for the whole argument.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          volumeMounts:
            {{- if .Values.agent.tokenSecret }}
            - {name: token, mountPath: /etc/brevis, readOnly: true}
            {{- end }}
            {{- if .Values.agent.secretsSecret }}
            - {name: secrets, mountPath: /etc/brevis/secrets, readOnly: true}
            {{- end }}
            - {name: state, mountPath: /var/lib/brevis-agent}
            # A step runs here and writes here.
            - {name: work, mountPath: /tmp}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # NOT read-only, and this is the one pod where it cannot be: a step
            # runs here. Every other one sets it true because every other one
            # executes nothing.
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
      volumes:
        {{- if .Values.agent.tokenSecret }}
        - name: token
          secret:
            secretName: {{ .Values.agent.tokenSecret }}
            items: [{key: token, path: token}]
        {{- end }}
        {{- if .Values.agent.secretsSecret }}
        - name: secrets
          secret: {secretName: {{ .Values.agent.secretsSecret }}}
        {{- end }}
        {{- if not .Values.agent.state.persistent }}
        # Lost at every rollout, and with it cancel and resume across a restart:
        # asked for with agent.state.persistent=false.
        - name: state
          emptyDir: {}
        {{- end }}
        - name: work
          emptyDir: {}
  {{- if .Values.agent.state.persistent }}
  # --state-dir on a volume that outlives the pod: the pid records a cancel
  # reads and the finished steps a resume reads (#137). On an emptyDir a
  # rollout loses both, and the engine runs a finished step again.
  #
  # IMMUTABLE on a StatefulSet that already exists. Upgrading from a chart that
  # had an emptyDir takes, once: kubectl delete statefulset <name> --cascade=orphan
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.agent.state.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.state.size }}
  {{- end }}
{{- end }}
