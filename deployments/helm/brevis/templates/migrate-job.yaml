{{/*
Migrations as a hook, before anything else starts.

`serve` never changes the schema -- migrations are their own subcommand -- so
something has to run them, and the order is not optional: an API pod that comes
up against an old schema fails queries it should serve.

pre-install AND pre-upgrade, because an upgrade is exactly when a new column
arrives. The weight -5 puts it ahead of the other hooked resources; the delete
policy keeps the Job when it FAILS, because the log of the failed migration is
the only thing that says why.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "brevis.fullname" . }}-migrate
  labels: {{- include "brevis.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "brevis.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # THE UID, not only "not root", and it is not belt-and-braces.
        #
        # Both images name their user rather than numbering it -- `USER
        # nonroot` on the distroless one, `USER brevis` on the worker -- and
        # the kubelet cannot verify a name against runAsNonRoot. It refuses:
        #
        #   container has runAsNonRoot and image has non-numeric user
        #   (nonroot), cannot verify user is non-root
        #
        # which arrives as CreateContainerConfigError and reads like a
        # permissions problem it is not. 65532 is what both images are.
        #
        # Five manifests in this repository already carried this line and five
        # did not, which is what a fix applied file by file as each one failed
        # looks like. They all carry it now.
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "brevis.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          env:
            {{- include "brevis.databaseEnv" . | nindent 12 }}
            {{- include "brevis.commonEnv" . | nindent 12 }}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext: {{- include "brevis.securityContext" . | nindent 12 }}
