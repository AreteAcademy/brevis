apiVersion: v2
name: brevis
description: A data orchestration runtime — the API, the scheduler and one pod per step
type: application

# The chart versions on its own; appVersion tracks the engine image.
#
# It drifted once: the chart said 0.13.0 while VERSION and
# deployments/kubernetes/ said 0.15.2, so installing the chart deployed an
# engine two releases behind the manifests beside it. Found by installing it
# into a cluster, not by reading it, because nothing read both numbers.
#
# `.github/scripts/image-pins-check.sh` reads both now and fails naming them,
# so appVersion cannot drift from VERSION in silence again. `version` above is
# the CHART's own and is deliberately checked against nothing: it moves when
# the templates move, which is not when the engine ships.
version: 0.3.0
appVersion: "0.18.0"

home: https://brevis.sh
sources:
  - https://github.com/AreteAcademy/brevis
keywords: [orchestration, etl, elt, data, scheduler, dbt]
maintainers:
  - name: Aretê Academy
    url: https://github.com/AreteAcademy
