# The scheduler's identity and the MINIMUM permission needed to create task
# pods.
#
# Two accounts, not one:
#
#   brevis-scheduler  creates and deletes pods. The only one that needs that
#                     permission.
#   brevis-task       the identity the task pods run as — with NO permission in
#                     the cluster.
#
# The separation is the point: the task's pod runs commands that came out of a
# YAML. If it inherited the scheduler's account, any workflow could create pods,
# read secrets and scale itself. With an account that has no role, the worst an
# arbitrary command does is use the credentials the installation explicitly gave
# it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brevis-scheduler
  namespace: dados
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brevis-task
  namespace: dados
  # Workload Identity: this is how the task's pod speaks to BigQuery, with no
  # key in a file.
  # annotations:
  #   iam.gke.io/gcp-service-account: brevis-task@PROJECT.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brevis-scheduler
  namespace: dados
rules:
  # No `update` and no `patch`: the scheduler creates, watches and deletes. It
  # never edits a pod in flight, and one more permission here is one more for
  # whoever compromises the process.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brevis-scheduler
  namespace: dados
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brevis-scheduler
subjects:
  - kind: ServiceAccount
    name: brevis-scheduler
    namespace: dados
