# The scheduler: it creates runs out of the schedules and executes them by
# creating one pod per step. It runs neither dbt nor Python — the pod it creates
# is what does that.
#
# Which is why the image here is Brevis's `-worker` (21 MB) and not the
# pipeline's: this process only speaks HTTP to the API server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brevis-scheduler
  namespace: dados
spec:
  # ONE replica. The dispatcher uses `FOR UPDATE SKIP LOCKED`, so two would not
  # hand out the same item — but two would also MATERIALIZE the same slots, and
  # what protects against that is the idempotency key, not a lock. One replica
  # keeps the behaviour obvious until there is leader election.
  replicas: 1
  strategy:
    # Recreate and not RollingUpdate: with two replicas up during the rollout,
    # the new one would start materializing schedules before the old one left.
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: brevis, app.kubernetes.io/component: scheduler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: brevis, app.kubernetes.io/component: scheduler}
      # This is the pod worth scraping. The API only serves screens; the
      # scheduler is what claims work and runs steps, so queue depth, claim
      # latency, slots in use and orphans recovered all live here. A dashboard
      # built on the API's scrape alone is a dashboard of an idle process.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: brevis-scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          image: daniel3843/brevis:0.2.1-worker
          # TWO ceilings, and the difference matters:
          #   --concurrency  how many RUNS the dispatcher executes at once
          #   --max-pods     how many STEPS exist at once = pods in the cluster
          #
          # With a ceiling of five pods: ten steps ready, five run, and the rest
          # go in as slots open up. Without --max-pods, five runs with three
          # parallel steps each would mean fifteen pods.
          args: ["scheduler", "--interval", "10s", "--concurrency", "10", "--max-pods", "5"]
          ports:
            - {name: metrics, containerPort: 9090}
          env:
            - name: BREVIS_ENV
              value: prod
            - name: BREVIS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: brevis-db, key: url}}

            # `on` and not `auto`: in this deployment, ending up without a
            # cluster has to be a boot error. With `auto`, a failure to mount the
            # service account would make the scheduler run EVERYTHING inside this
            # 128Mi pod, in silence.
            - name: BREVIS_PODS
              value: "on"
            - name: BREVIS_POD_SERVICE_ACCOUNT
              value: brevis-task
            # The task pods' credentials. The list comes from here, from the
            # installation — never from the workflow's YAML.
            - name: BREVIS_POD_ENV_FROM_SECRETS
              value: brevis-task-env
            # The tasks' node pool. The dev cluster runs on arm64 (t2a), and
            # without the selector the tasks land on any node.
            - name: BREVIS_POD_NODE_SELECTOR
              value: "kubernetes.io/arch=arm64"
            # The arm64 pool is tainted; without the toleration the task's pod
            # stays Pending forever — with no error, just stopped.
            - name: BREVIS_POD_TOLERATIONS
              value: "kubernetes.io/arch=arm64:NoSchedule"
            # During an incident, `true` leaves the failed pod up for
            # inspection.
            - name: BREVIS_POD_MANTER_EM_FALHA
              value: "false"

            # Failure alerting. The webhook is a credential: whoever has the URL
            # posts in the channel as if they were the platform, so it lives in a
            # Secret and never in the workflow's YAML.
            - name: BREVIS_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef: {name: brevis-slack, key: webhook, optional: true}
            # Without it the alert says what failed but forces the reader to
            # find the run by hand.
            - name: BREVIS_UI_URL
              value: https://brevis.example.com
          resources:
            # The scheduler only orchestrates: the heavy work is in the pods it
            # creates. These numbers are for a Go process that speaks HTTP and
            # SQL.
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
