# Not meant to be applied: it is the pod Brevis CREATES, written by hand, to be
# read.
#
# When a step like this is published…
#
#   name: platform_workspace
#   image: us-central1-docker.pkg.dev/acme/apps/dbt:1.10.3
#   resources: {cpu: 200m, memory: 1Gi, limits: {memory: 2Gi}}
#   steps:
#     - id: bronze_workspace
#       run: dbt build --select bronze_workspace+
#
# …the scheduler assembles exactly this:
apiVersion: v1
kind: Pod
metadata:
  # Deterministic per (run, step, attempt). If the scheduler dies between
  # creating the pod and recording that, the next attempt runs into THIS pod
  # instead of starting a second one running the same dbt in parallel.
  name: platform-workspace-bronze-workspace-a632ae46
  namespace: dados
  labels:
    app.kubernetes.io/managed-by: brevis
    brevis.dev/workflow: platform-workspace
    brevis.dev/node: bronze-workspace
    brevis.dev/run: 1f2e3d4c-0000-0000-0000-000000000000
  annotations:
    # The original value: a label is limited to 63 characters and a restricted
    # alphabet.
    brevis.dev/workflow: platform_workspace
spec:
  restartPolicy: Never          # the dispatcher is what counts attempts
  serviceAccountName: brevis-task
  activeDeadlineSeconds: 1800   # the safety net on the cluster's side
  containers:
    - name: step
      image: us-central1-docker.pkg.dev/acme/apps/dbt:1.10.3
      command: ["/bin/sh", "-c", "dbt build --select bronze_workspace+"]
      envFrom:
        - secretRef: {name: brevis-task-env}
      resources:
        requests: {cpu: 200m, memory: 1Gi}
        limits: {memory: 2Gi}
