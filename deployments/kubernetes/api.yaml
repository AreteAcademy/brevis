# The API and the UI. It runs nothing — hence the distroless image, with no
# shell, and a ServiceAccount with no permission in the cluster at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brevis-api
  namespace: dados
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: brevis, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: brevis, app.kubernetes.io/component: api}
      # The API reports the queue's depth and nothing else — it executes no
      # steps. The numbers worth watching are on the scheduler's pod.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Explicit: without this the pod gets the namespace's `default`, which
      # usually has more permission than people assume.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: daniel3843/brevis:0.8.0
          args: ["serve"]
          # TWO ports, and only `http` belongs in the Ingress below.
          #
          # `metrics` is separate because the http port is behind auth.Gate: a
          # scrape endpoint there would either need a session — which no scraper
          # has — or publish every workflow and step name to whoever finds the
          # path. Routing 9090 through an Ingress undoes that.
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9090, name: metrics}
          env:
            - name: BREVIS_ENV
              value: prod
            - name: BREVIS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: brevis-db, key: url}}
            - name: BREVIS_BRAND_FILE
              value: /etc/brevis/brand.yaml
          volumeMounts:
            - {name: brand, mountPath: /etc/brevis, readOnly: true}
          # /health does not touch the database and /ready does: a liveness
          # probe that depends on the database restarts the API because of a
          # Postgres failover, which only makes things worse.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: brand
          configMap: {name: brevis-brand, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: brevis-api
  namespace: dados
spec:
  selector: {app.kubernetes.io/name: brevis, app.kubernetes.io/component: api}
  # `http` only, on purpose. This Service is what the Ingress points at, and
  # adding the metrics port here is one `ServiceMonitor`-shaped convenience away
  # from publishing it. The scrape reaches the POD, through the annotations
  # above; if this installation needs a ServiceMonitor, give it a second
  # headless Service rather than widening this one.
  ports: [{port: 80, targetPort: http, name: http}]
