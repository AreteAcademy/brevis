# Publishing the workflows — the equivalent of Leoflow's per-DAG
# `leoflow deploy`.
#
# The design difference: in Leoflow each DAG is a registered artifact (and, when
# it has code of its own, a built image). Here the FOLDER is the artifact: a
# ConfigMap with the YAMLs, and a Job that applies them. Publishing a new
# workflow is updating the ConfigMap and running the Job again — there is no
# per-DAG build.
#
#   kubectl -n dados create configmap brevis-workflows \
#     --from-file=brevis/workflows/ --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n dados delete job brevis-publish --ignore-not-found
#   kubectl apply -f deployments/kubernetes/publish-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: brevis-publish
  namespace: dados
spec:
  # The Job does not retry on its own: publishing is idempotent, but an error
  # here is about CONTENT (invalid YAML, an impossible cron) and retrying does
  # not fix it.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publish
          image: daniel3843/brevis:0.11.2-worker
          # `--prune` makes the folder the source of truth: a workflow that
          # leaves the ConfigMap leaves the database, schedule and all. Without
          # it, removing a YAML would leave its schedule creating runs forever.
          args: ["publish", "/workflows", "--project", "acme", "--prune"]
          env:
            - name: BREVIS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: brevis-db, key: url}}
          volumeMounts:
            - {name: workflows, mountPath: /workflows, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: workflows
          configMap: {name: brevis-workflows}
