name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: `sdk/v0.1.0` is published and irreversibly broken. If you
        are on it, upgrade to the latest -- that is not a new bug.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`go list -m github.com/AreteAcademy/brevis/sdk`, or `brevis version` for the CLI"
      placeholder: v0.2.1
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [sdk/extract, sdk/load, CLI, engine, site, CI]
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: And where that is documented, if it is.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The complete error message, if there is one. Do not trim the stack trace.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The smallest program that shows the problem. If HTTP is involved, an
        `httptest.Server` returning the offending response is worth more than a
        description of the real API.
      render: go
    validations:
      required: true

  - type: input
    id: goversion
    attributes:
      label: Go version
      placeholder: go1.25.7 darwin/arm64
