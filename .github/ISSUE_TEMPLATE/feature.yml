name: Proposal
description: Suggest a feature or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem this solves
      description: |
        The concrete case, not the feature. "I need to paginate an API that
        returns the cursor in a custom header" says more than "add header
        support".
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How you solve it today
      description: If it can be solved outside the SDK, that weighs against adding public surface.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How you picture the API
      render: go

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Needs no new dependency in the SDK (there are three today; the project's argument is binary size)
        - label: Or it does, and I justified above why that is worth it
