name: Test & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: |
          cd sdk
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./sdk/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  motor:
    name: Engine
    runs-on: ubuntu-latest

    # O modulo RAIZ -- runner, executores, API, notify, scheduler.
    #
    # It had no CI at all: every job in this file and in quality.yml does
    # `cd sdk`, and the only `go test ./...` at the root lived in the release
    # gate. Since the release had never run, the engine reached v0.4.0 without a
    # test having run outside the machine of whoever wrote it -- and the first
    # attempt to publish died on a test pinned to that person's timezone.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          arquivos=$(gofmt -l . | grep -v '^sdk/' || true)
          if [ -n "$arquivos" ]; then
            echo "::error::gofmt: $arquivos"
            exit 1
          fi

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      # -race because the runner is concurrent by design: it executes levels of
      # the
      # DAG em paralelo e drena eventos de varios executores. Uma corrida aqui
      # aparece como uma execucao que falha uma vez em cinquenta.
      - name: Tests
        run: go test -race ./...

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::rode 'go mod tidy' e commite"; exit 1; }

      # web/'s generated artifacts are versioned, because the image has neither
      # Node nor templ. Checking here catches stale CSS at push time, and not
      # only at
      # hora de publicar.
      - name: Generated artifacts
        run: ./.github/scripts/generated-check.sh

      - name: Engine weight
        run: ./.github/scripts/peso-do-motor.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --timeout=5m

  integration:
    name: Integration
    runs-on: ubuntu-latest
    # The integration tests are the only ones that prove a row actually goes in
    # and comes out. They existed since v0.2.1 and sat behind an environment
    # variable until v0.11.0 -- when they finally ran, they found four defects in
    # one execution. A test behind a variable is a test that does not run.
    env:
      BREVIS_IT_S3_ENDPOINT: http://localhost:9000
      BREVIS_IT_S3_KEY: brevis
      BREVIS_IT_S3_SECRET: brevis-secret
      BREVIS_IT_PG_DSN: postgres://brevis:brevis@localhost:55432/brevis_it
      BREVIS_IT_MYSQL_DSN: root:brevis@tcp(localhost:53306)/brevis_it
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # docker run, and not a service container: MinIO's official image needs
      # "server /data" as its command, and Actions services do not
      # aceitam command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=brevis \
            -e MINIO_ROOT_PASSWORD=brevis-secret \
            minio/minio:latest server /data

          for i in $(seq 1 40); do
            if curl -fs http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO no ar"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO did not start; the S3 tests would not have run"
          docker logs minio
          exit 1

      # Postgres comes up through the same compose that runs on a developer's
      # machine, and not through a service container -- so the command that fixes
      # CI is the command that fixes local.
      - name: Start Postgres and MySQL
        run: |
          docker compose -f docker-compose.drivers.yml up -d postgres mysql
          for service in postgres mysql; do
            ready=""
            for i in $(seq 1 60); do
              state=$(docker compose -f docker-compose.drivers.yml ps "$service" --format '{{.Health}}')
              if [ "$state" = "healthy" ]; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "::error::$service did not start; its tests would not have run"
              docker compose -f docker-compose.drivers.yml logs "$service"
              exit 1
            fi
            echo "$service is up"
          done

      - name: Integration - object storage (MinIO)
        run: |
          cd sdk
          go test -v -timeout 10m -run Integration ./from/...

      - name: Dependency pruning per driver
        run: .github/scripts/pruning-check.sh

      - name: Integration - Postgres and MySQL
        run: |
          cd sdk
          go test -v -timeout 10m -run Integration ./to/postgres/ ./to/mysql/

      # secrets cannot be used in a step's if:, so it becomes a job-level
      # environment variable and the check is against that.
      - name: Authenticate to Google Cloud
        if: env.GCP_CREDENTIALS != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Integration - BigQuery and GCS
        if: env.GCP_CREDENTIALS != ''
        env:
          BREVIS_IT_PROJECT: ${{ vars.BREVIS_IT_PROJECT }}
          BREVIS_IT_DATASET: ${{ vars.BREVIS_IT_DATASET }}
          BREVIS_IT_BUCKET: ${{ vars.BREVIS_IT_BUCKET }}
        run: |
          cd sdk
          go test -v -timeout 20m -run Integration ./load/... ./from/...

      # The engine, with real parts: a binary compiled against the SDK, the
      # process executor, an operating-system pipe and Postgres.
      #
      # Everything else on the stages path was tested with a fake executor: the
      # `@brevis:` line had never crossed a real pipe, and that is how the
      # engine's v0.4.0 shipped with the feature never exercised end to end.
      - name: Engine integration
        env:
          BREVIS_IT_PG_DSN: postgres://brevis:brevis@localhost:55432/brevis_it
          BREVIS_DATABASE_URL: postgres://brevis:brevis@localhost:55432/brevis_it
          # The queue's own tests read THIS one, and CI never set it: 14 of the
          # 15 in dispatcher_test.go skipped, so the claim path, the
          # per-workflow limit, the backoff and the orphan recovery ran on a
          # laptop and nowhere else. The job was green the whole time.
          BREVIS_TEST_DATABASE_URL: postgres://brevis:brevis@localhost:55432/brevis_it
        run: |
          go run ./cmd/brevis migrate up
          go test -v -timeout 10m -run Integration ./internal/...
          go test -v -timeout 10m ./internal/scheduler/ ./internal/queue/

      - name: Say what did not run
        if: env.GCP_CREDENTIALS == ''
        run: |
          echo "::warning::The BigQuery integration did not run: the secret is missing"
          echo "::warning::GCP_CREDENTIALS and the BREVIS_IT_PROJECT,"
          echo "::warning::BREVIS_IT_DATASET e BREVIS_IT_BUCKET. Dezessete"
          echo "::warning::testes ficaram em SKIP."

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run go fmt
        run: |
          cd sdk
          if [ "$(go fmt ./... | wc -l)" -gt 0 ]; then
            echo "❌ gofmt found issues:"
            go fmt ./...
            exit 1
          fi
          echo "✅ gofmt OK"

      - name: Run go vet
        run: |
          cd sdk
          go vet ./...
          echo "✅ go vet OK"

      - name: Run go mod tidy
        run: |
          cd sdk
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "❌ go mod tidy not run"; exit 1)
          echo "✅ go mod tidy OK"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: sdk
          args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./sdk/...'

      - name: Upload Gosec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          wait-for-processing: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build SDK
        run: |
          cd sdk
          go build ./...
          echo "✅ Build successful"

      - name: Build the engine
        run: |
          # cmd/brevis is the Brevis binary itself: serve, scheduler, migrate,
          # publish, validate, backfill. It lives in the root module, and for
          # a while nothing built it -- an SDK CLI had been written over its
          # main.go, and the whole engine became a library with no program.
          go build ./...
          go vet ./...
          echo "✅ engine builds"

      - name: Build and test the SDK CLI
        run: |
          # Its own module, so it pins a released SDK and only breaks on a
          # bump. Nothing else would catch it.
          #
          # `go test` and not only build: the `load` command shipped reading
          # NOTHING from stdin -- it loaded zero rows and printed "Load
          # completed" -- and a build plus a vet had nothing to say about it.
          cd cmd/brevis-sdk
          go build ./...
          go vet ./...
          go test ./... -count=1
          echo "✅ SDK CLI builds and passes"

      - name: Build and test examples
        run: |
          # No '|| true' here. This step used to swallow every failure and
          # print a success line, which is how six examples that did not
          # compile at all sat in the repo unnoticed.
          cd examples
          go build ./...
          go vet ./...
          go test ./...
          echo "✅ Examples compile and pass"