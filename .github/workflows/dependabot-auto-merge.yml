name: Dependabot auto-merge

# Merges Dependabot PRs once every other check on the PR has passed, by this policy:
#   - security updates (the `security` group in .github/dependabot.yml): any non-major update;
#   - version updates, when VERSION_UPDATES is "true": minor and patch for language packages and
#     GitHub Actions, patch only for docker / docker-compose (a base-image minor often swaps the
#     runtime), never terraform (CI runs plan, not apply).
# Grouped PRs carry the highest update type in the group, so a group holding a major is left for a
# human, as are all other majors. A merge to the default branch deploys, so VERSION_UPDATES is
# "true" only in repos whose PR checks build and test the code.
#
# The merge uses DEPENDABOT_AUTOMERGE_TOKEN, a Dependabot secret (workflows triggered by Dependabot
# cannot read Actions secrets): a merge made with GITHUB_TOKEN does not trigger the push-to-main
# workflows, so nothing would be tagged or deployed. Without the secret the job only warns.
on: pull_request

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

env:
  VERSION_UPDATES: "true"

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Apply the merge policy
        id: policy
        env:
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          merge=false
          if [ "$TYPE" != "version-update:semver-major" ]; then
            if [ "$GROUP" = "security" ]; then
              merge=true
            elif [ "$VERSION_UPDATES" = "true" ]; then
              case "$ECOSYSTEM:$TYPE" in
                terraform:*) ;;
                docker:version-update:semver-patch | docker_compose:version-update:semver-patch | docker-compose:version-update:semver-patch) merge=true ;;
                docker:* | docker_compose:* | docker-compose:*) ;;
                *:version-update:semver-minor | *:version-update:semver-patch) merge=true ;;
              esac
            fi
          fi
          echo "group=${GROUP:-none} type=${TYPE:-unknown} ecosystem=$ECOSYSTEM -> merge=$merge"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: Merge once the other checks pass
        if: steps.policy.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: Dependabot auto-merge
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::warning::DEPENDABOT_AUTOMERGE_TOKEN is not set; leaving this update for a human."
            exit 0
          fi
          # REST check runs + commit statuses of the head commit, normalized to {name, state}.
          # Not gh pr checks: on private repos it returned nothing to the Dependabot token, so the loop
          # waited until the timeout instead of merging or failing.
          # Only the newest run per name counts, so a re-run replaces an earlier failure.
          poll() {
            local runs statuses
            runs=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]') || return 1
            statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[]') || return 1
            jq -s --arg self "$SELF" '
              group_by(.name) | map(max_by(.id)) | map(select(.name != $self)) | map({name, state:
                (if .status != "completed" then "pending"
                 elif (.conclusion | IN("success")) then "pass"
                 elif (.conclusion | IN("skipped", "neutral")) then "skip"
                 else "fail" end)})' <<<"$runs" > runs.json
            jq -s 'map({name: .context, state:
                (if .state == "success" then "pass" elif .state == "pending" then "pending" else "fail" end)})' <<<"$statuses" > statuses.json
            jq -s 'add' runs.json statuses.json
          }
          settled=0
          idle=0
          for _ in $(seq 1 100); do
            sleep 30
            if ! checks=$(poll); then
              echo "::warning::could not read the checks of $HEAD_SHA; retrying"
              continue
            fi
            echo "checks: $(jq -c 'group_by(.state) | map({(.[0].state): length}) | add // {}' <<<"$checks")"
            failed=$(jq -r '.[] | select(.state == "fail") | .name' <<<"$checks")
            if [ -n "$failed" ]; then
              echo "::error::not merging, failed checks: $(tr '\n' ',' <<<"$failed")"
              exit 1
            fi
            pending=$(jq '[.[] | select(.state == "pending")] | length' <<<"$checks")
            passed=$(jq '[.[] | select(.state == "pass")] | length' <<<"$checks")
            if [ "$passed" -eq 0 ]; then
              # No check ran on this PR (e.g. path filters skipped CI): nothing validated it, so
              # leave it for a human instead of waiting for the timeout.
              if [ "$pending" -eq 0 ]; then
                idle=$((idle + 1))
                if [ "$idle" -ge 20 ]; then
                  echo "::notice::no other check ran on this PR; leaving it for a human."
                  exit 0
                fi
              else
                idle=0
              fi
              continue
            fi
            if [ "$pending" -eq 0 ]; then
              # Require two consecutive settled polls so a slow-starting workflow is not missed.
              settled=$((settled + 1))
              if [ "$settled" -ge 2 ]; then
                GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR" --rebase --match-head-commit "$HEAD_SHA"
                exit 0
              fi
            else
              settled=0
            fi
          done
          echo "::error::timed out waiting for the other checks"
          exit 1
