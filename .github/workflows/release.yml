# Publishes the images to Docker Hub on every `v*` tag.
#
# A tag and not a push to main: a published image is an artifact other people
# will consume, and the moment of publishing should be an explicit decision — not
# the side effect of a merge.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao a publicar (ex.: 0.1.0)"
        required: true

env:
  IMAGE: docker.io/areteacademy/brevis

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      # write, because the last step of a release is the Release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The gate before publishing. An image leaving CI with a red test is
      # worse than no image: somebody will run it believing it passed.
      - name: Tests
        run: go test ./...

      # The CSS and the _templ.go files are embedded in the binary and go in
      # versioned; if somebody forgets to run `make generate`, the image ships
      # with the old UI.
      #
      # This step used to run only templ, despite the comment claiming it covered
      # `make generate` -- and that is the gap a stale app.css came through into
      # the 0.4.0 image. The script checks BOTH generators, with both versions
      # pinned.
      - name: Check the generated artifacts
        run: ./.github/scripts/generated-check.sh

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve the version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The VERSION file's version and the tag's have to match. Without this
      # check, `brevis version` inside the image would lie about the tag that
      # published it — and that is what an incident is traced by.
      - name: Check VERSION
        run: |
          file=$(cat VERSION)
          if [ "$file" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::VERSION=$file differs from the tag ${{ steps.v.outputs.version }}"
            exit 1
          fi

      # The release notes come from the changelog, which is written anyway.
      #
      # EARLY, before a single image is pushed: a missing section is a mistake
      # to find before the artifacts exist, not after. It is the same argument
      # as the VERSION check above, one line further.
      #
      # Missing section is an ERROR and not an empty body, for the reason
      # publish-sdk.yml gives: a release published with no notes is one nobody
      # goes back to fix.
      # The gate that refused `ded9bed` and could not stop it.
      #
      # `VERSION` said 0.17.0, every manifest in the tag said 0.16.1, this
      # check went red on the release commit, and the tag was cut anyway. A
      # gate that only runs where somebody can ignore it is a gate with a
      # door beside it. Here it runs before the first image is pushed.
      - name: The manifests pin this version
        run: ./.github/scripts/image-pins-check.sh

      - name: Extract the changelog section
        run: |
          NUMBER="${{ steps.v.outputs.version }}"
          awk -v want="## [$NUMBER]" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## \[/   { exit }
            inside               { print }
          ' CHANGELOG-motor.md | sed -e 's/^---$//' > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG-motor.md has no section for $NUMBER. Add one before tagging."
            exit 1
          fi
          echo "✅ $(wc -l < notes.md) line(s) of notes for $NUMBER"

      - name: API (distroless)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }},${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Worker (with a shell)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-worker,${{ env.IMAGE }}:latest-worker
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A THIRD image, because a host runs the agent and nothing else. It is
      # alpine rather than distroless: the agent's whole job is running the
      # commands a step names, and a runtime with no shell cannot.
      - name: Agent (the other half of `host:`)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-agent,${{ env.IMAGE }}:latest-agent
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # The tag becomes a page somebody can read.
      #
      # Until this existed, 84 Releases were published and every one of them was
      # the SDK: the engine and the gateway were tagged, their images pushed,
      # and the Releases page showed a third of the story. A consumer running
      # the gateway -- which is what every open issue is filed against -- had
      # nowhere to see what changed.
      #
      # ONLY ON A TAG. `workflow_dispatch` carries a version and no tag, so
      # `github.ref_name` would be a branch, and a Release named after a branch
      # is worse than none.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Engine v${{ steps.v.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: false

      # The Hub's overview, from a file in this repository rather than typed
      # into the web UI. A page edited in a browser has nobody to review it and
      # no reason to stay true: the one thing worse than an empty registry page
      # is one still teaching last year's install command.
      #
      # Last, so a failed build never leaves the page describing an image that
      # is not there.
      - name: The Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: areteacademy/brevis
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: "A data orchestration runtime, in Go. Workflows, a queue, a scheduler and a UI in one binary."
