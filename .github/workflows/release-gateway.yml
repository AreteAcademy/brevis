# Publishes the gateway's image on every `gateway/v*` tag.
#
# Its OWN repository and its own tag, which is what the market does for a
# distinct component -- Grafana and Loki, Temporal's server and ui, every
# Kubernetes component -- and not the `-worker` suffix this repository already
# uses. That suffix is for the SAME binary on a different base; the gateway is a
# different binary from a different Go module.
#
# Its own version, too, and that is the part worth defending: the gateway is
# young. Calling it 0.15.3 because the engine is there would claim a maturity it
# does not have, and versions cannot be un-published. Aligning two cadences
# later is easy; splitting one is not.
name: release gateway

on:
  push:
    tags: ["gateway/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

env:
  IMAGE: docker.io/areteacademy/brevis-gateway

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # write, because the last step of a release is the Release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache: true

      # THE LOGIN COMES FIRST, BEFORE ANYTHING PULLS.
      #
      # It used to sit next to the push, which is where a login looks like it
      # belongs -- and every pull before it was anonymous. Docker Hub counts
      # the anonymous limit per source IP and a GitHub runner shares its IP
      # with every other runner, so the quota is spent by strangers. `Test &
      # Lint` lost three pushes in a row to `toomanyrequests` on 2026-10-09,
      # at the first `docker run` of the job.
      #
      # Here that would land on a gate, minutes before publishing, and read
      # as the gate refusing. A check that cannot RUN still reports a
      # failure, and this repository already tagged `v0.17.0` over one.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A Postgres for the gate below, and it is the point of this step.
      #
      # `go test ./...` on its own SKIPS every integration test -- they look
      # for BREVIS_GATEWAY_TEST_PG_DSN and quietly stand down when it is
      # missing -- so this gate reported green over a suite that never touched
      # a database. gateway/v0.11.0 published while master was red for exactly
      # that: an eighth fixed column was added and the tests asserting the
      # column list were only ever run in `Test & Lint`, next door.
      #
      # A check that cannot fail is worse than no check, and this one had been
      # passing without running since the integration tests were written.
      # THE COMPOSE FILE'S postgres, not a second one written here. One
      # definition of "the test database" -- same port, same credentials, same
      # name -- so this gate and `Test & Lint` cannot drift apart.
      #
      # And it waits on the HEALTHCHECK rather than polling pg_isready, which
      # is what the first version of this did and why it failed: the alpine
      # image runs a temporary server for initdb and then restarts, so
      # pg_isready answers yes against the temporary one and the next command
      # lands in the restart window. `rejecting connections`, on a database
      # that was seconds from being up.
      - name: A database for the tests that need one
        run: |
          docker compose -f docker-compose.drivers.yml up -d postgres
          ready=""
          for i in $(seq 1 60); do
            state=$(docker compose -f docker-compose.drivers.yml ps postgres --format '{{.Health}}')
            if [ "$state" = "healthy" ]; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::postgres did not start; the integration tests would have skipped"
            docker compose -f docker-compose.drivers.yml logs postgres
            exit 1
          fi
          echo "postgres is up"

      # The gate before publishing. An image leaving CI with a red test is
      # worse than no image: somebody will run it believing it passed.
      - name: Tests
        env:
          BREVIS_GATEWAY_TEST_PG_DSN: postgres://brevis:brevis@localhost:55432/brevis_it
        run: |
          cd gateway
          GOFLAGS=-mod=mod go test ./... -count=1

      # Both mains have to compile, and the weight tests assert the slim one
      # does not link what it does not register. Without this the slim image
      # could be published carrying everything -- 49 MB under a name that
      # promises 10 -- and the only symptom would be the pull.
      - name: Both binaries, and the slim one is actually slim
        run: |
          cd gateway
          export GOFLAGS=-mod=mod
          go build ./cmd/gateway ./cmd/gateway-slim
          full=$(go list -deps ./cmd/gateway | wc -l)
          slim=$(go list -deps ./cmd/gateway-slim | wc -l)
          echo "full: $full packages, slim: $slim"
          if [ "$slim" -ge "$full" ]; then
            echo "::error::the slim build is not smaller than the full one"
            exit 1
          fi

      # A release is immutable, so this runs BEFORE the tag is turned into an
      # image. gateway/v0.3.1 shipped an image that worked and a module that
      # did not compile, and the two cannot be told apart from the outside.
      - name: A consumer can build this module
        run: .github/scripts/gateway-consumer-check.sh

      - name: Resolve the version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME#gateway/v}"
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          fi

      # The tag and the file have to agree, for the reason the engine's release
      # gate gives: otherwise the image reports a version that is not the tag
      # that published it -- and that is what an incident is traced by.
      - name: Check VERSION
        run: |
          file=$(cat gateway/VERSION)
          if [ "$file" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::gateway/VERSION=$file differs from the tag ${{ steps.v.outputs.version }}"
            exit 1
          fi

      # The release notes come from the changelog, which is written anyway.
      #
      # EARLY, before a single image is pushed: a missing section is a mistake
      # to find before the artifacts exist, not after. It is the same argument
      # as the VERSION check above, one line further.
      #
      # Missing section is an ERROR and not an empty body, for the reason
      # publish-sdk.yml gives: a release published with no notes is one nobody
      # goes back to fix.
      - name: Extract the changelog section
        run: |
          NUMBER="${{ steps.v.outputs.version }}"
          awk -v want="## [$NUMBER]" '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## \[/   { exit }
            inside               { print }
          ' gateway/CHANGELOG.md | sed -e 's/^---$//' > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::gateway/CHANGELOG.md has no section for $NUMBER. Add one before tagging."
            exit 1
          fi
          echo "✅ $(wc -l < notes.md) line(s) of notes for $NUMBER"

      # BOTH GATES BEFORE THE FIRST PUSH, which is where they were not.
      #
      # They sat after `Gateway` and `Gateway (slim)`, so on 2026-10-10 the
      # 0.27.1 images went to Docker Hub and the run then died on
      # `cli-docs-check.sh` -- a published image and no Release, which is the
      # pair nobody can tell apart from the outside. An image is the one thing
      # in this job that cannot be taken back; everything that could object
      # has to speak before it exists. The engine's release has had this order
      # since v0.17.1 and this one did not.
      - name: The overview fits
        run: .github/scripts/hub-overview-check.sh

      # THE COMMANDS ARE DOCUMENTED, asked at the moment one reaches somebody.
      #
      # This gate reads the subcommands out of the binaries and fails when a
      # document has stopped naming one. It was repaired twice -- once because
      # a renamed file made half of it skip in silence, and `brevis gateway`
      # shipped undocumented; once because it searched for a bare word that
      # every document already contained. And no release ever ran it: it was
      # green on the push and nobody asked it at the moment a command actually
      # went out. That is the shape of `v0.17.0`, where the gate that would
      # have objected was simply not consulted.
      - name: Every command is documented
        run: .github/scripts/cli-docs-check.sh

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }},${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The slim image, from the SAME build context and the same tag.
      #
      # Same commit, always: two images built from two checkouts is how a
      # `-slim` tag ends up one commit behind the one it claims to match, and
      # an operator comparing them has no way to see it.
      #
      # No `latest-slim`. `latest` is already a tag nobody should deploy; a
      # second floating one would be a second way to be surprised.
      - name: Gateway (slim)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: gateway-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-slim
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Hub's overview, from a file in this repository rather than typed
      # into the web UI. Last, so a failed build never leaves the page
      # describing an image that is not there.
      #
      # Its OWN file, and not docs/GATEWAY.md. Docker Hub truncates past 25,000
      # bytes and the action below reports that as a WARNING, not an error --
      # so the reference doc crossed the limit at v0.3.2 and the page had been
      # cut mid-sentence ever since, in a job that stayed green. A Hub page and
      # a repository reference are different documents for different readers.
      # The tag becomes a page somebody can read.
      #
      # Until this existed, 84 Releases were published and every one of them was
      # the SDK: the engine and the gateway were tagged, their images pushed,
      # and the Releases page showed a third of the story. A consumer running
      # the gateway -- which is what every open issue is filed against -- had
      # nowhere to see what changed.
      #
      # ONLY ON A TAG. `workflow_dispatch` carries a version and no tag, so
      # `github.ref_name` would be a branch, and a Release named after a branch
      # is worse than none.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Gateway v${{ steps.v.outputs.version }}
          body_path: notes.md
          draft: false
          prerelease: false

      - name: The Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: areteacademy/brevis-gateway
          readme-filepath: ./docs/GATEWAY-hub.md
          short-description: "An HTTP endpoint that lands data: validate, shape, batch, deliver."
