# Publishes the gateway's image on every `gateway/v*` tag.
#
# Its OWN repository and its own tag, which is what the market does for a
# distinct component -- Grafana and Loki, Temporal's server and ui, every
# Kubernetes component -- and not the `-worker` suffix this repository already
# uses. That suffix is for the SAME binary on a different base; the gateway is a
# different binary from a different Go module.
#
# Its own version, too, and that is the part worth defending: the gateway is
# young. Calling it 0.15.3 because the engine is there would claim a maturity it
# does not have, and versions cannot be un-published. Aligning two cadences
# later is easy; splitting one is not.
name: release gateway

on:
  push:
    tags: ["gateway/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

env:
  IMAGE: docker.io/areteacademy/brevis-gateway

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: true

      # A Postgres for the gate below, and it is the point of this step.
      #
      # `go test ./...` on its own SKIPS every integration test -- they look
      # for BREVIS_GATEWAY_TEST_PG_DSN and quietly stand down when it is
      # missing -- so this gate reported green over a suite that never touched
      # a database. gateway/v0.11.0 published while master was red for exactly
      # that: an eighth fixed column was added and the tests asserting the
      # column list were only ever run in `Test & Lint`, next door.
      #
      # A check that cannot fail is worse than no check, and this one had been
      # passing without running since the integration tests were written.
      - name: A database for the tests that need one
        run: |
          docker run -d --name pg -p 55432:5432 \
            -e POSTGRES_PASSWORD=brevis -e POSTGRES_USER=brevis \
            -e POSTGRES_DB=brevis_it postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U brevis >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec pg pg_isready -U brevis

      # The gate before publishing. An image leaving CI with a red test is
      # worse than no image: somebody will run it believing it passed.
      - name: Tests
        env:
          BREVIS_GATEWAY_TEST_PG_DSN: postgres://brevis:brevis@localhost:55432/brevis_it
        run: |
          cd gateway
          GOFLAGS=-mod=mod go test ./... -count=1

      # Both mains have to compile, and the weight tests assert the slim one
      # does not link what it does not register. Without this the slim image
      # could be published carrying everything -- 49 MB under a name that
      # promises 10 -- and the only symptom would be the pull.
      - name: Both binaries, and the slim one is actually slim
        run: |
          cd gateway
          export GOFLAGS=-mod=mod
          go build ./cmd/gateway ./cmd/gateway-slim
          full=$(go list -deps ./cmd/gateway | wc -l)
          slim=$(go list -deps ./cmd/gateway-slim | wc -l)
          echo "full: $full packages, slim: $slim"
          if [ "$slim" -ge "$full" ]; then
            echo "::error::the slim build is not smaller than the full one"
            exit 1
          fi

      # A release is immutable, so this runs BEFORE the tag is turned into an
      # image. gateway/v0.3.1 shipped an image that worked and a module that
      # did not compile, and the two cannot be told apart from the outside.
      - name: A consumer can build this module
        run: .github/scripts/gateway-consumer-check.sh

      - name: Resolve the version
        id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME#gateway/v}"
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          fi

      # The tag and the file have to agree, for the reason the engine's release
      # gate gives: otherwise the image reports a version that is not the tag
      # that published it -- and that is what an incident is traced by.
      - name: Check VERSION
        run: |
          file=$(cat gateway/VERSION)
          if [ "$file" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::gateway/VERSION=$file differs from the tag ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }},${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The slim image, from the SAME build context and the same tag.
      #
      # Same commit, always: two images built from two checkouts is how a
      # `-slim` tag ends up one commit behind the one it claims to match, and
      # an operator comparing them has no way to see it.
      #
      # No `latest-slim`. `latest` is already a tag nobody should deploy; a
      # second floating one would be a second way to be surprised.
      - name: Gateway (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gateway-slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-slim
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Hub's overview, from a file in this repository rather than typed
      # into the web UI. Last, so a failed build never leaves the page
      # describing an image that is not there.
      #
      # Its OWN file, and not docs/GATEWAY.md. Docker Hub truncates past 25,000
      # bytes and the action below reports that as a WARNING, not an error --
      # so the reference doc crossed the limit at v0.3.2 and the page had been
      # cut mid-sentence ever since, in a job that stayed green. A Hub page and
      # a repository reference are different documents for different readers.
      - name: The overview fits
        run: .github/scripts/hub-overview-check.sh

      - name: The Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: areteacademy/brevis-gateway
          readme-filepath: ./docs/GATEWAY-hub.md
          short-description: "An HTTP endpoint that lands data: validate, shape, batch, deliver."
