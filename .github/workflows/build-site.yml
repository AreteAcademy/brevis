name: Build & Deploy Site

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/build-site.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'site/**'

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: The build is up to date
        run: |
          cd site
          python3 build.py --check

      # THE HTML VALIDATION STEP WAS REMOVED, and that is an improvement.
      #
      # It ran `tidy ... || true` in a loop and then printed "✅ HTML
      # validation passed" unconditionally -- a tick whether every page parsed
      # or none did. Trying to make it fail is what found the reason it was
      # silenced: `tidy` is an HTML4-era tool and does not know HTML5. On this
      # site it reports `<svg>`, `<symbol>`, `<path>`, `<use>`, `<circle>` AND
      # `<header>` and `<nav>` as unrecognised, so all 43 pages "fail" and
      # none of it is about the pages.
      #
      # Teaching it the tags is a whitelist that grows every time a page uses
      # an element from this decade. So the step is gone rather than silenced,
      # because a check that cannot fail is worse than no check: it reads as
      # coverage somebody is relying on.
      #
      # What would replace it is the Nu Html Checker (`html5validator`), which
      # understands HTML5 and SVG. It needs a JVM on the runner. Not done here
      # rather than half-done: writing an untested validation step into CI is
      # the same mistake in a newer tool.
      #
      # What still runs: `build.py --check` proves the committed output matches
      # the sources, and the link check below fails on a real class of bug.

      - name: Check CSS
        run: |
          cd site/css
          echo "Checking CSS syntax..."
          if grep -n "{{" *.css; then
            echo "⚠️  Found template syntax in CSS"
            exit 1
          fi
          echo "✅ CSS looks good"

      # `if grep … | head -5; then` took its exit status from `head`, which
      # always succeeds -- so the branch always ran and the warning printed on
      # zero matches, every build, since it was written. A check that cannot
      # fail is worse than no check: it buys confidence it has not earned.
      #
      # It also fails the build now instead of printing a warning nobody reads.
      - name: Check links in HTML
        run: |
          cd site
          if bad=$(grep -o 'href="[^"]*"' index.html 404.html docs/*/index.html \
                     en/index.html en/docs/*/index.html | grep -E 'href="[0-9]'); then
            echo "::error::hrefs starting with a digit, which are relative by accident:"
            echo "$bad"
            exit 1
          fi
          echo "✅ no href starts with a digit"

      - name: Validate Docker build
        run: |
          cd site
          docker build -t brevis-site:ci .
          echo "✅ Docker build validation passed"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@latest

      - name: Start local server
        run: |
          cd site
          python3 -m http.server 8000 &
          sleep 2
          curl -s http://localhost:8000 > /dev/null || (echo "Server failed"; exit 1)

      - name: Run Lighthouse
        run: lhci autorun --config=site/.lighthouserc.json || true
        continue-on-error: true

  publish:
    name: Publish site image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: env.DOCKER_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: ./site
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/brevis-site:latest
            ${{ secrets.DOCKER_USERNAME }}/brevis-site:${{ github.sha }}

      - name: Build only (no credentials configured)
        if: env.DOCKER_USERNAME == ''
        run: |
          cd site
          docker build -t brevis-site:test .
          echo "✅ Docker build successful (DOCKER_USERNAME secret not set; skipping push)"
