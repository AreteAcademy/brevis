name: Publish Python

# The library is published from a `py/v*` tag, separately from the engine's
# `v*` and the SDK's `sdk/v*`. Three artifacts, three cadences: a fix to the
# Python library must not force an engine release.
on:
  push:
    tags:
      - 'py/v*'

permissions:
  contents: read
  # For PyPI's trusted publishing: no token in a secret, and nothing to rotate.
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: lib/python-context

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The DECLARED floor, not the newest. A library that only runs on 3.12 is
      # a library a data team on a managed cluster cannot install, and that is
      # the audience this exists for.
      - name: Tests on the declared minimum
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Tests on a current Python
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      # It reads an environment variable and writes a file. If that ever needs
      # a dependency, something has gone wrong that a review would miss.
      - name: Gate - the library depends on nothing
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          mods = set()
          for f in pathlib.Path("src").rglob("*.py"):
              for node in ast.walk(ast.parse(f.read_text())):
                  if isinstance(node, ast.Import):
                      mods.update(a.name.split(".")[0] for a in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods.add(node.module.split(".")[0])
          # An ALLOWLIST rather than sys.stdlib_module_names, which does not
          # exist before 3.10 -- so this gate keeps working if the steps above
          # are ever reordered, and it is stricter: a new stdlib import is a
          # decision somebody makes here rather than one that slips through.
          allowed = {"__future__", "atexit", "json", "logging", "os", "tempfile", "typing"}
          outside = sorted(mods - allowed)
          if outside:
              print("::error::the library imports", ", ".join(outside),
                    "-- add it here deliberately, or do not add it")
              raise SystemExit(1)
          print("imports only:", ", ".join(sorted(mods)))
          PY

      # The tag and the version have to agree, for the reason the engine's
      # release gate gives: otherwise `pip show` reports a version that is not
      # the tag that published it, and that is what an incident is traced by.
      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/py/v}"
          FILE=$(grep -oE '^version = "[^"]+"' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::pyproject version=$FILE differs from the tag $TAG"
            exit 1
          fi
          echo "✅ $FILE matches the tag"

      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lib/python-context/dist/

  # 0.1.0 shipped a wheel and no sdist: the wheel uploaded, the sdist was
  # refused because a file of that exact name had belonged to a previously
  # DELETED project, and PyPI's filename ledger outlives the project forever.
  # The step above failed loudly, which is the only reason anybody noticed.
  #
  # Nothing local can see that ledger, so the guard has to be on this side of
  # the upload: assert what is actually on the index, rather than trusting that
  # a step which reported success uploaded everything it was given.
  verify:
    name: Verify what is on the index
    runs-on: ubuntu-latest
    needs: [publish]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Both a wheel AND an sdist, for the version the tag names
        run: |
          VERSION="${GITHUB_REF#refs/tags/py/v}"
          python - "$VERSION" <<'PY'
          import json, sys, time, urllib.request

          version = sys.argv[1]
          # The index is not instantaneous after an upload.
          for attempt in range(20):
              with urllib.request.urlopen("https://pypi.org/pypi/brevis/json") as r:
                  data = json.load(r)
              files = data.get("releases", {}).get(version, [])
              kinds = {f["packagetype"] for f in files}
              if {"bdist_wheel", "sdist"} <= kinds:
                  print(f"brevis {version}: {sorted(kinds)}")
                  sys.exit(0)
              print(f"attempt {attempt + 1}: {sorted(kinds) or 'nothing yet'}")
              time.sleep(15)

          print(f"::error::brevis {version} is on PyPI with {sorted(kinds)} -- "
                "a release missing one of the two is a partial release")
          sys.exit(1)
          PY

      - name: Install it the way a consumer does
        run: |
          VERSION="${GITHUB_REF#refs/tags/py/v}"
          python -m pip install --quiet "brevis==$VERSION"
          BREVIS_INPUT='{"extract":{"bucket":"s3://landing"}}' \
          BREVIS_OUTPUT="$RUNNER_TEMP/out.json" \
            python -c "
          from brevis import context
          assert context.get('extract.bucket') == 's3://landing'
          context.set(rows=1)
          print('the published package reads and writes')
          "
