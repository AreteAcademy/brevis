name: Publish Python

# The library is published from a `py/v*` tag, separately from the engine's
# `v*` and the SDK's `sdk/v*`. Three artifacts, three cadences: a fix to the
# Python library must not force an engine release.
on:
  push:
    tags:
      - 'py/v*'

permissions:
  contents: read
  # For PyPI's trusted publishing: no token in a secret, and nothing to rotate.
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: lib/python-context

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The same script test.yml runs on every push, on the DECLARED floor.
      # It used to be inline here, and that is precisely how `importlib` got
      # into __init__.py after py/v0.1.1 without anybody finding out: these
      # gates ran only at publish, when the tag is already pushed.
      - name: Gates on the declared minimum
        run: |
          python -m pip install --quiet pytest
          ../../.github/scripts/python-check.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: The same gates on a current Python
        run: |
          python -m pip install --quiet pytest
          ../../.github/scripts/python-check.sh

      # The tag and the version have to agree, for the reason the engine's
      # release gate gives: otherwise `pip show` reports a version that is not
      # the tag that published it, and that is what an incident is traced by.
      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/py/v}"
          FILE=$(grep -oE '^version = "[^"]+"' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::pyproject version=$FILE differs from the tag $TAG"
            exit 1
          fi
          echo "✅ $FILE matches the tag"

      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build

      # The sdist and the wheel are uploaded SEPARATELY, sdist first, and that
      # order is the whole point.
      #
      # PyPI's filename ledger outlives a deleted project forever, and a
      # previously deleted project called `brevis` poisoned some of these
      # names. It has now happened twice: 0.1.0 and 0.2.0 each had their wheel
      # accepted with a 200 and their sdist refused with a 400, leaving a
      # WHEEL-ONLY version on the index that `pip install` happily resolves and
      # `pip install --no-binary` cannot.
      #
      # Uploading everything from one directory made that outcome unavoidable:
      # the wheel goes first alphabetically, so by the time the sdist is
      # refused the release is already half published and the version is spent.
      #
      # With the sdist first, a burned filename costs nothing -- nothing
      # reaches the index, the job fails, and the next version is tried with a
      # clean slate. There is no API that answers "is this filename burned", so
      # trying is the only way to find out; this makes trying cheap.
      - name: Split the artefacts
        run: |
          mkdir -p dist-sdist dist-wheel
          mv dist/*.tar.gz dist-sdist/
          mv dist/*.whl dist-wheel/

      - name: Publish the sdist FIRST
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lib/python-context/dist-sdist/

      - name: Then the wheel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lib/python-context/dist-wheel/

  # 0.1.0 shipped a wheel and no sdist: the wheel uploaded, the sdist was
  # refused because a file of that exact name had belonged to a previously
  # DELETED project, and PyPI's filename ledger outlives the project forever.
  # The step above failed loudly, which is the only reason anybody noticed.
  #
  # Nothing local can see that ledger, so the guard has to be on this side of
  # the upload: assert what is actually on the index, rather than trusting that
  # a step which reported success uploaded everything it was given.
  verify:
    name: Verify what is on the index
    runs-on: ubuntu-latest
    needs: [publish]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Both a wheel AND an sdist, for the version the tag names
        run: |
          VERSION="${GITHUB_REF#refs/tags/py/v}"
          python - "$VERSION" <<'PY'
          import json, sys, time, urllib.request

          version = sys.argv[1]
          # The index is not instantaneous after an upload.
          for attempt in range(20):
              with urllib.request.urlopen("https://pypi.org/pypi/brevis/json") as r:
                  data = json.load(r)
              files = data.get("releases", {}).get(version, [])
              kinds = {f["packagetype"] for f in files}
              if {"bdist_wheel", "sdist"} <= kinds:
                  print(f"brevis {version}: {sorted(kinds)}")
                  sys.exit(0)
              print(f"attempt {attempt + 1}: {sorted(kinds) or 'nothing yet'}")
              time.sleep(15)

          print(f"::error::brevis {version} is on PyPI with {sorted(kinds)} -- "
                "a release missing one of the two is a partial release")
          sys.exit(1)
          PY

      - name: Install it the way a consumer does
        run: |
          VERSION="${GITHUB_REF#refs/tags/py/v}"
          python -m pip install --quiet "brevis==$VERSION"
          BREVIS_INPUT='{"extract":{"bucket":"s3://landing"}}' \
          BREVIS_OUTPUT="$RUNNER_TEMP/out.json" \
            python -c "
          from brevis import context
          assert context.get('extract.bucket') == 's3://landing'
          context.set(rows=1)
          print('the published package reads and writes')
          "
