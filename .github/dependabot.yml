# Dependabot: weekly on Monday 09:00 BRT, the same model as the other Zarv
# repositories. New releases wait out a cooldown (7 days, 14 for majors) before
# a PR is opened, so a compromised version is usually pulled from the registry
# before it reaches us.
#
# TWO GROUPS PER ECOSYSTEM. `security` carries the security updates (any
# non-major is merged by .github/workflows/dependabot-auto-merge.yml once every
# other check has passed); the other carries the week's minor and patch bumps,
# merged the same way. A major is never grouped and never merged by a machine.
#
# Six Go modules and an exporter: a module this file does not name is a module
# nothing will ever bump. `labels` must already exist in the repository --
# dependabot cannot create one, and names a PR with nothing if it is renamed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
    open-pull-requests-limit: 5
    labels: ["ci", "github-actions"]
    groups:
      github-actions: { applies-to: version-updates, patterns: ["*"], update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The engine. Its ceiling is engine-weight.sh, which a bump can move.
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The SDK. Its ceiling is pruning-check.sh.
  - package-ecosystem: gomod
    directory: "/sdk"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The gateway: its own module, its own version, its own release.
  - package-ecosystem: gomod
    directory: "/gateway"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The CLI. It requires the PUBLISHED SDK on purpose -- `go install
  # pkg@version` refuses a module carrying replace directives -- so a bump
  # here is a bump of what a consumer installs.
  - package-ecosystem: gomod
    directory: "/cmd/brevis-sdk"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The examples are a gate on the working tree: CI builds them against
  # ../sdk, so a breaking change shows up there first.
  - package-ecosystem: gomod
    directory: "/examples"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # brevis-sql. ONE REQUIRE, and that is the point of it: a bump that pulls
  # in a graph is the thing to see in a diff.
  - package-ecosystem: gomod
    directory: "/sql"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The OTLP exporter, a module of its own so its weight never reaches
  # anybody who does not ask for it.
  - package-ecosystem: gomod
    directory: "/sdk/metrics/otelmeter"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      gomod-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: pip
    directory: "/lib/python-context"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7, semver-major-days: 14 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      pip-minor-and-patch: { applies-to: version-updates, update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  # The engine's image, the site's and the examples'.
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      docker: { applies-to: version-updates, patterns: ["*"], update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: docker
    directory: "/site"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      docker: { applies-to: version-updates, patterns: ["*"], update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: docker-compose
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Sao_Paulo }
    cooldown: { default-days: 7 }
    commit-message: { prefix: chore, include: scope }
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      docker-compose: { applies-to: version-updates, patterns: ["*"], update-types: [minor, patch] }
      security: { applies-to: security-updates, patterns: ["*"] }
    # Postgres majors move with the production database; keep local and CI on
    # the major the product supports.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
