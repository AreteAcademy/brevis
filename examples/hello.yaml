# The example that RUNS anywhere.
#
# The other two files in this folder came from the plan and exist to show the
# FORMAT -- they call `python`, `docker.run` and `./notify.sh`, which do not
# exist in the worker's image. This one uses shell only, so it serves to prove
# the stack end to end:
#
#   brevis publish examples/hello.yaml
#   then click ▶ on the workflows screen
name: hello
type: dag
tags: [example]

steps:
  - id: prepare
    run: sh -c 'echo preparing; sleep 1'

  # The next two depend on the same step, so they run IN PARALLEL -- you can see
  # both turn blue at the same time on the graph.
  - id: extract
    run: sh -c 'sleep 2; echo 42 extracted'
    depends_on: [prepare]

  - id: validate
    run: sh -c 'sleep 1; echo validated'
    depends_on: [prepare]

  - id: publish
    run: echo published
    depends_on: [extract, validate]
