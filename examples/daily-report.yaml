# The plan's example, exactly as asked for -- ILLUSTRATIVE, it does not run as
# written.
#
# `python fetch.py`, `docker.run` and `./notify.sh` do not exist in the worker's
# image: running it ends in "step \"fetch_data\": exited with code 127 (command
# not found)". To see the stack working end to end, use `examples/hello.yaml`.
#
# `type: chain` means the order is the file's: fetch_data -> build_report ->
# notify. The parser turns that into edges, so the engine only ever knows DAGs.
schedule: "0 2 * * *"   # every day at 02:00
type: chain
tags: [report, daily]

steps:
  - id: fetch_data
    run: python fetch.py

  - id: build_report
    action: docker.run
    with:
      image: ghcr.io/acme/reporting:1.4.2
      volumes:
        - ~/data:/work/data
      command: python report.py

  - id: notify
    run: ./notify.sh
