# ILLUSTRATIVE: `kubernetes.run` and `brevis run --select` do not exist yet, so
# this file shows the FORMAT, not a runnable workflow. The one that actually runs
# is `examples/hello.yaml`.
#
# The same engine with explicit dependencies, for when the order is not linear.
# Here gold_metrics and gold_users run IN PARALLEL after silver.
name: daily_analytics
type: dag
tags: [analytics, dbt, daily]

steps:
  - id: ingest_users
    action: kubernetes.run
    with:
      image: company/ingestion:latest

  - id: transform_silver
    run: brevis run --select silver.*
    depends_on: [ingest_users]

  - id: gold_metrics
    run: brevis run --select gold.metrics
    depends_on: [transform_silver]

  - id: gold_users
    run: brevis run --select gold.users
    depends_on: [transform_silver]

  - id: publish
    run: ./publish.sh
    depends_on: [gold_metrics, gold_users]
