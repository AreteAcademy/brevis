<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Brevis">
  <!-- The breve -- the Latin sign for a short syllable. brevis is scanned
       brĕvis, so the mark is the word as its own sign. Same file as
       site/assets/mark.svg: one identity, two surfaces.

       currentColor, so it follows the theme and a client's palette without a
       variant per brand. -->
  <path d="M4 10.4C4 15.2 20 15.2 20 10.4" stroke="currentColor"
        stroke-width="3" stroke-linecap="round"/>
</svg>
