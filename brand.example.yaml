# The installation's visual identity.
#
# Copy it to `brand.yaml` at the root (or point BREVIS_BRAND_FILE at it) and
# adjust. Every field is optional: what you do not write keeps the default, so a
# file with only `title:` is already valid.
#
# An unrecognized key is an ERROR, not a field that gets ignored: a typo used to
# leave the installation on the default identity while somebody looked for the
# reason their colours had not applied. The names became English in v0.7 -- a
# file still using `titulo:` and `tema:` fails saying so.
#
# What is NOT customizable: the "Powered by Brevis" line in the sidebar's
# footer. It is not a field of this file — it comes from the code.

title: Brevis                 # the sidebar and the pages' <title>
subtitle: Orchestration       # the small caps under the title

# The graphic mark next to the title, in the sidebar and on the sign-in screen.
# It takes a URL (https:// or http://) or an internal path starting with `/`.
# Absent, it uses Brevis's embedded symbol, which follows the theme's colour.
#
# A logo hosted elsewhere depends on that host: if it goes down, or if the
# cluster has no route to the internet, the image does not load — the rest of the
# interface keeps working, but count on that when choosing.
# logo: https://example.com/mark.svg

# The line break is preserved: it sets the phrase's rhythm in the sidebar.
phrase: |
  Clarity, structure and virtue
  are also part
  of whoever builds.

# Colours. Hex values (#rgb, #rrggbb or #rrggbbaa) — anything else is refused at
# boot, and the installation comes up with the default theme and a warning in the
# log.
#
# EVERY COLOUR IS OPTIONAL, and one is enough: a colour you leave out stays the
# product's own (the dark console), so `accent: "#c02a2a"` repaints the accent and
# nothing else. Do not copy the whole block below -- write only what you change.
#
# `--color-line` and the golden highlight are derived from `ink` and `accent`,
# with transparency. There is deliberately no field for them: a border that does
# not match the very ink you chose is a mistake nobody should be able to make.
#
# theme:
#   background: "#0d1117"       # the page
#   background_soft: "#1c2128"  # a step above it
#   surface: "#161b22"          # cards and tables
#   ink: "#e6edf3"              # the main text
#   muted: "#a3abb5"            # secondary text
#   accent: "#7d8e50"           # details and links
#   accent_strong: "#c7d66d"    # the primary action and the open section
#
#   # The run states. They are worth keeping distinguishable from each other
#   # even on a poor screen — they are the panel's most important information.
#   success: "#3fb950"
#   failed: "#f85149"
#   running: "#58a6ff"
#   queued: "#d29922"
#   retrying: "#db6d28"
#   canceled: "#8b949e"
#   pending: "#8b949e"
#   skipped: "#a371f7"

# The console's LIGHT theme, for a visitor who switches to it (the button at the
# sidebar's foot; the choice is kept in a cookie). Same keys as `theme:`, and
# every one optional: what you leave out keeps the product's light value.
#
# It is its own block because `theme:` describes the default, dark console --
# your dark ground carried into the light theme would be dark on dark. Without
# `theme_light:` at all, the light theme is the product's, whatever `theme:` says.
# theme_light:
#   background: "#f5f6f0"
#   ink: "#1b1f16"
#   accent_strong: "#4a5714"   # the primary action and the open section: text on it is the background
