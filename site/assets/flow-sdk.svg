  <title id="flow-sdk-t">The SDK: extract, transform, load</title>
  <desc id="flow-sdk-d">An SDK pipeline in three calls. sdk.Extract reads from an HTTP API with from.HTTP, sdk.Transform keeps the accepted fields, and sdk.Load writes the rows to a BigQuery table. The three calls run inside your own step, in the Go library brevis/sdk.</desc>
