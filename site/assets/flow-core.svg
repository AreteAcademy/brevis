<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 436" role="img"
     aria-labelledby="flow-core-t flow-core-d" fill="none">
  <title id="flow-core-t">The Core: schedule, queue, one pod per step</title>
  <desc id="flow-core-d">The Core holds a scheduler and a queue, kept in Postgres. It starts one pod per step of the workflow: prepare, extract, validate and publish. Only control lines leave the Core. The data goes from an HTTP source into the extract pod, which runs the SDK, and from there to BigQuery; no data passes through the Core.</desc>
  <!-- The Core's flow. The one rule: no data line touches the Core. Data
       paths are class data, absolute M/H/V only, and enter the extract
       pod from below; check_flow.py proves none crosses id=core. The
       Core only sends control lines (ctl) to the pods.

       Generated by bravis-work/spikes/site-flows/make_flow.py; checked by
       check_flow.py. Text on the figure is names and code only: the
       sentences are in the HTML beside it, in both languages. Palette fixed:
       an <img> inherits no page CSS. -->
  <style>
    .box  { fill: #1a1e15; stroke: #38412b; stroke-width: 1; }
    .end  { fill: #141711; stroke: #38412b; stroke-width: 1; }
    .lit  { fill: #1f2419; stroke: #c7d66d; stroke-width: 1; stroke-opacity: .45; }
    .wrap { fill: none; stroke: #7d8e50; stroke-width: 1; stroke-dasharray: 4 4; }
    .data { fill: none; stroke: #c7d66d; stroke-width: 1.4; stroke-dasharray: 4 5; animation: flow 1.1s linear infinite; }
    .head { fill: #c7d66d; }
    .ctl  { fill: none; stroke: #869853; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .ctlh { fill: #869853; }
    .ico  { color: #a3ad97; }
    .t    { font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .m    { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .name { font-size: 15px; font-weight: 600; fill: #ecefe4; }
    .code { font-size: 12px; fill: #a3ad97; }
    .pod  { font-size: 10.5px; }
    .lbl  { font-size: 11px; fill: #869853; letter-spacing: .06em; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @media (prefers-reduced-motion: reduce) { .data { animation: none; } }
  </style>
  <defs>
