<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"
     aria-labelledby="proj-t proj-d">
  <title id="proj-t">The Brevis console, Projects</title>
  <desc id="proj-d">Two projects, analytics and platform, each namespacing its own workflows so both can have a daily_ingest without colliding. A workflow joins one with brevis publish --project.</desc>
  <style>
    .bg{fill:#141711}.card{fill:#1a1e15;stroke:#38412b;stroke-width:1}
    .side{fill:#181b13}.rule{stroke:#38412b;stroke-width:1}
    .t{font-family:"IBM Plex Sans",system-ui,sans-serif}
    .m{font-family:"IBM Plex Mono",ui-monospace,monospace}
    .lbl{font-size:8px;letter-spacing:.1em;fill:#c7d66d}
    .h{font-size:15px;font-weight:600;fill:#ecefe4}
    .row{font-size:9.5px;fill:#ecefe4}.dim{font-size:8.5px;fill:#868f7c}
    .chip{fill:#141711;stroke:#38412b;stroke-width:.8}
    .ok{fill:#8fd49e}.bad{fill:#ff9c92}.run{fill:#93c5f0}
    .nav{font-size:10px;fill:#cfd5c5}.navon{font-size:10px;font-weight:600;fill:#ecefe4}
  </style>
  <rect class="bg" width="1000" height="600"/>
  <rect class="side" width="150" height="600"/>
  <path class="rule" d="M150 0v600M150 44h850"/>
  <path d="M22 26c0 3.4 11 3.4 11 0" stroke="#7d8e50" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text class="t h" x="40" y="30" font-size="13">Brevis</text>
  <!-- the sidebar as the console draws it now: three groups, one section open -->
  <text class="m lbl" x="14" y="54">PIPELINES</text>
  <text class="t nav" x="20" y="72">Overview</text>
  <text class="t nav" x="20" y="92">Workflows</text>
  <text class="t nav" x="20" y="112">Runs</text>
  <text class="m lbl" x="14" y="138">DATA</text>
  <text class="t nav" x="20" y="156">Catalog</text>
  <text class="t nav" x="20" y="176">Endpoints</text>
  <text class="t nav" x="20" y="196">SQL</text>
  <text class="m lbl" x="14" y="222">WORKSPACE</text>
  <rect x="8" y="226" width="134" height="20" rx="2" fill="#1f2419"/>
  <path d="M9 226v20" stroke="#7d8e50" stroke-width="2"/>
  <text class="t" x="20" y="240" font-size="10" font-weight="600" fill="#ecefe4">Projects</text>
  <text class="t dim" x="168" y="20">Workspace / Projects</text>
  <text class="t h" x="168" y="36" font-size="16">Projects</text>
  <text class="t" x="168" y="72" font-size="9.5" fill="#cfd5c5">A project namespaces its workflows: two projects can each have a <tspan class="m" font-size="9">daily_ingest</tspan> without colliding.</text>
  <text class="t" x="168" y="88" font-size="9.5" fill="#cfd5c5">A workflow joins one with <tspan class="m" font-size="9">brevis publish --project</tspan>.</text>
  <rect class="card" x="168" y="110" width="252" height="112" rx="2"/>
  <text class="t" x="184" y="136" font-size="13" font-weight="600" fill="#ecefe4">analytics</text>
  <text class="m dim" x="404" y="136" text-anchor="end">analytics</text>
  <text class="m lbl" x="184" y="160">WORKFLOWS</text>
  <text class="m lbl" x="278" y="160">RUNS</text>
  <text class="t" x="184" y="186" font-size="20" font-weight="600" fill="#ecefe4">12</text>
  <text class="t" x="278" y="186" font-size="20" font-weight="600" fill="#ecefe4">1,284</text>
  <text class="t dim" x="184" y="208">since 2026-09-01</text>
  <rect class="card" x="436" y="110" width="252" height="112" rx="2"/>
  <text class="t" x="452" y="136" font-size="13" font-weight="600" fill="#ecefe4">platform</text>
  <text class="m dim" x="672" y="136" text-anchor="end">platform</text>
  <text class="m lbl" x="452" y="160">WORKFLOWS</text>
  <text class="m lbl" x="546" y="160">RUNS</text>
  <text class="t" x="452" y="186" font-size="20" font-weight="600" fill="#ecefe4">7</text>
  <text class="t" x="546" y="186" font-size="20" font-weight="600" fill="#ecefe4">418</text>
  <text class="t dim" x="452" y="208">since 2026-09-04</text>
</svg>
