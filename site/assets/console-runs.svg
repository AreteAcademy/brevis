    .chip{fill:#f1f2ec;stroke:#dfe2d6;stroke-width:.8}
    .ok{fill:#4c7a56}.bad{fill:#b0503c}.run{fill:#3f6d8f}
    .nav{font-size:10px;fill:#4a5340}.navon{font-size:10px;font-weight:600;fill:#1f2419}
  </style>
