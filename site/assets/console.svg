<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"
     aria-labelledby="cons-t cons-d">
  <title id="cons-t">The Brevis console, Overview</title>
  <desc id="cons-d">A dashboard showing a 94.2 per cent success rate over 344
    runs, a bar chart of runs per hour for the last 24 hours with average
    duration, a distribution ring, the runs in progress, and the next scheduled
    runs with their cron expressions.</desc>

  <!-- Redrawn, not a screenshot: the real console runs a customer's data, and
       the workflow names there are theirs. Every name below is invented. The
       ground is light because that is what the console is — read for hours,
       in a bright office — while the site is dark by decision. -->
  <style>
    .bg{fill:#f1f2ec}.card{fill:#fff;stroke:#dfe2d6;stroke-width:1}
    .side{fill:#e9ebe1}.rule{stroke:#dfe2d6;stroke-width:1}
    .t{font-family:"IBM Plex Sans",system-ui,sans-serif}
    .m{font-family:"IBM Plex Mono",ui-monospace,monospace}
    .lbl{font-size:8px;letter-spacing:.1em;fill:#7d8e50}
    .h{font-size:15px;font-weight:600;fill:#1f2419}
    .big{font-size:26px;font-weight:600}
    .txt{font-size:9.5px;fill:#4a5340}.dim{font-size:8.5px;fill:#8b9280}
    .ok{fill:#4c7a56}.bad{fill:#b0503c}.run{fill:#3f6d8f}.q{fill:#8a7a3d}
    .nav{font-size:10px;fill:#4a5340}.navon{font-size:10px;font-weight:600;fill:#1f2419}
  </style>

  <rect class="bg" width="1000" height="600"/>
  <rect class="side" width="150" height="600"/>
  <path class="rule" d="M150 0v600M150 44h850"/>

  <!-- sidebar -->
  <path d="M22 26c0 3.4 11 3.4 11 0" stroke="#5e6b40" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text class="t h" x="40" y="30" font-size="13">Brevis</text>
  <text class="m lbl" x="14" y="44">ORCHESTRATION</text>
  <rect x="8" y="58" width="134" height="20" rx="2" fill="#dfe2d6"/>
  <path d="M9 58v20" stroke="#5e6b40" stroke-width="2"/>
  <text class="t navon" x="20" y="72">Overview</text>
  <text class="t nav" x="20" y="98">Workflows</text>
  <text class="t nav" x="20" y="122">Runs</text>
  <text class="t nav" x="20" y="146">Projects</text>

  <text class="m lbl" x="168" y="20">DASHBOARD</text>
  <text class="t h" x="168" y="36" font-size="16">Overview</text>

  <!-- four stat cards -->
  <g>
    <rect class="card" x="168" y="60" width="196" height="66" rx="2"/>
    <text class="m lbl" x="180" y="76">SUCCESS RATE</text>
    <text class="t big ok" x="180" y="102">94.2%</text>
    <text class="t dim" x="180" y="116">324 of 344 finished</text>
  </g>
  <g>
    <rect class="card" x="374" y="60" width="196" height="66" rx="2"/>
    <text class="m lbl" x="386" y="76">FAILURE RATE</text>
    <text class="t big bad" x="386" y="102">5.8%</text>
    <text class="t dim" x="386" y="116">20 runs failed</text>
  </g>
  <g>
    <rect class="card" x="580" y="60" width="196" height="66" rx="2"/>
    <text class="m lbl" x="592" y="76">RUNNING</text>
    <text class="t big run" x="592" y="102">2</text>
    <text class="t dim" x="592" y="116">average duration 1m 08s</text>
  </g>
  <g>
    <rect class="card" x="786" y="60" width="196" height="66" rx="2"/>
    <text class="m lbl" x="798" y="76">QUEUED</text>
    <text class="t big q" x="798" y="102">0</text>
    <text class="t dim" x="798" y="116">0 items queued</text>
  </g>

  <!-- runs per hour -->
  <rect class="card" x="168" y="138" width="608" height="212" rx="2"/>
  <text class="m lbl" x="180" y="156">RUNS PER HOUR</text>
  <text class="t dim" x="180" y="170">Count and average duration over the last 24 hours.</text>
  <g class="m" font-size="7" fill="#8b9280">
    <text x="180" y="192">40</text><text x="180" y="240">30</text>
    <text x="180" y="288">20</text><text x="182" y="330">0</text>
  </g>
  <path class="rule" d="M196 188h564M196 236h564M196 284h564" opacity=".55"/>
  <path class="rule" d="M196 326h564"/>
  <!-- bars: success stacked with a thin failure cap -->
  <g class="ok">
    <rect x="204" y="292" width="16" height="34"/><rect x="228" y="286" width="16" height="40"/>
    <rect x="252" y="288" width="16" height="38"/><rect x="276" y="284" width="16" height="42"/>
    <rect x="300" y="290" width="16" height="36"/><rect x="324" y="262" width="16" height="64"/>
    <rect x="348" y="272" width="16" height="54"/><rect x="372" y="280" width="16" height="46"/>
    <rect x="396" y="286" width="16" height="40"/><rect x="420" y="288" width="16" height="38"/>
    <rect x="444" y="284" width="16" height="42"/><rect x="468" y="286" width="16" height="40"/>
    <rect x="492" y="282" width="16" height="44"/><rect x="516" y="268" width="16" height="58"/>
    <rect x="540" y="266" width="16" height="60"/><rect x="564" y="264" width="16" height="62"/>
    <rect x="588" y="268" width="16" height="58"/><rect x="612" y="276" width="16" height="50"/>
    <rect x="636" y="274" width="16" height="52"/><rect x="660" y="278" width="16" height="48"/>
    <rect x="684" y="284" width="16" height="42"/><rect x="708" y="286" width="16" height="40"/>
    <rect x="732" y="290" width="16" height="36"/>
  </g>
  <g class="bad">
    <rect x="228" y="282" width="16" height="4"/><rect x="324" y="257" width="16" height="5"/>
    <rect x="348" y="268" width="16" height="4"/><rect x="516" y="263" width="16" height="5"/>
    <rect x="564" y="259" width="16" height="5"/><rect x="636" y="270" width="16" height="4"/>
  </g>
  <rect class="run" x="732" y="286" width="16" height="4"/>
  <!-- average duration line -->
  <path d="M212 226l24-3 24 4 24-2 24 5 24-18 24 8 24 6 24-2 24 3 24-4 24 2 24-3 24-11 24-2 24-4 24 6 24 5 24-2 24 4 24 3 24 2 24-1"
        fill="none" stroke="#7d8e50" stroke-width="1.3"/>
  <text class="t dim" x="760" y="172" text-anchor="end">peak average: 1m 34s</text>
  <g class="t dim" font-size="7.5">
    <text x="212" y="340">23h</text><text x="308" y="340">03h</text><text x="404" y="340">07h</text>
    <text x="500" y="340">11h</text><text x="596" y="340">15h</text><text x="692" y="340">19h</text>
  </g>

  <!-- distribution ring -->
  <rect class="card" x="786" y="138" width="196" height="212" rx="2"/>
  <text class="m lbl" x="798" y="156">DISTRIBUTION</text>
  <circle cx="884" cy="222" r="46" fill="none" stroke="#4c7a56" stroke-width="15"/>
  <circle cx="884" cy="222" r="46" fill="none" stroke="#b0503c" stroke-width="15"
          stroke-dasharray="17 272" transform="rotate(-90 884 222)"/>
  <text class="t" x="884" y="220" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2419">344</text>
  <text class="m lbl" x="884" y="234" text-anchor="middle">RUNS</text>
  <g class="t" font-size="8.5" fill="#4a5340">
    <circle class="ok" cx="800" cy="292" r="2.5"/><text x="808" y="295">Success</text>
    <text class="m" x="970" y="295" text-anchor="end" fill="#1f2419">324</text>
    <circle class="bad" cx="800" cy="308" r="2.5"/><text x="808" y="311">Failure</text>
    <text class="m" x="970" y="311" text-anchor="end" fill="#1f2419">20</text>
    <circle class="run" cx="800" cy="324" r="2.5"/><text x="808" y="327">Running</text>
    <text class="m" x="970" y="327" text-anchor="end" fill="#1f2419">2</text>
  </g>

  <!-- in progress -->
  <rect class="card" x="168" y="362" width="380" height="222" rx="2"/>
  <text class="m lbl" x="180" y="380">IN PROGRESS</text>
  <g class="m lbl" fill="#8b9280">
    <text x="180" y="400">WORKFLOW</text><text x="330" y="400">TRIGGER</text>
    <text x="420" y="400">STARTED</text><text x="490" y="400">STATE</text>
  </g>
  <path class="rule" d="M180 408h356"/>
  <g class="m" font-size="9" fill="#1f2419">
    <text x="180" y="424">daily_ingest</text><text x="330" y="424" fill="#4a5340">schedule</text>
    <text x="420" y="424" fill="#4a5340">now</text>
    <rect x="486" y="415" width="46" height="12" rx="2" fill="#e4ecf2"/>
    <circle class="run" cx="494" cy="421" r="2"/><text x="500" y="424" font-size="7.5" class="run">running</text>
    <text x="180" y="448">catalog_refresh</text><text x="330" y="448" fill="#4a5340">manual</text>
    <text x="420" y="448" fill="#4a5340">42s ago</text>
    <rect x="486" y="439" width="46" height="12" rx="2" fill="#e4ecf2"/>
    <circle class="run" cx="494" cy="445" r="2"/><text x="500" y="448" font-size="7.5" class="run">running</text>
  </g>

  <!-- upcoming -->
  <rect class="card" x="558" y="362" width="424" height="222" rx="2"/>
  <text class="m lbl" x="570" y="380">UPCOMING RUNS</text>
  <g class="m lbl" fill="#8b9280">
    <text x="570" y="400">WORKFLOW</text><text x="756" y="400">SCHEDULE</text>
    <text x="890" y="400">NEXT</text>
  </g>
  <path class="rule" d="M570 408h400"/>
  <g class="m" font-size="9">
    <text x="570" y="424" fill="#1f2419">weather_alerts</text><text x="756" y="424" fill="#4a5340">*/15 * * * *</text><text x="970" y="424" text-anchor="end" fill="#4a5340">in 3 min</text>
    <text x="570" y="446" fill="#1f2419">billing_sync</text><text x="756" y="446" fill="#4a5340">20 5 * * *</text><text x="970" y="446" text-anchor="end" fill="#4a5340">in 6h</text>
    <text x="570" y="468" fill="#1f2419">user_metrics</text><text x="756" y="468" fill="#4a5340">30 6 * * *</text><text x="970" y="468" text-anchor="end" fill="#4a5340">in 7h</text>
    <text x="570" y="490" fill="#1f2419">risk_score</text><text x="756" y="490" fill="#4a5340">0 3 * * 0</text><text x="970" y="490" text-anchor="end" fill="#4a5340">in 3d</text>
    <text x="570" y="512" fill="#1f2419">catalog_refresh</text><text x="756" y="512" fill="#4a5340">15 * * * *</text><text x="970" y="512" text-anchor="end" fill="#4a5340">in 12 min</text>
    <text x="570" y="534" fill="#1f2419">daily_ingest</text><text x="756" y="534" fill="#4a5340">0 5 * * *</text><text x="970" y="534" text-anchor="end" fill="#4a5340">in 6h</text>
  </g>
</svg>
