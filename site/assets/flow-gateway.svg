  <title id="flow-gateway-t">The Gateway: receive, identify, batch, deliver</title>
  <desc id="flow-gateway-d">A client sends an HTTP POST to /v1/clicks. The Gateway decodes it, computes its ingestion_id, answers 202 straight away and appends it to a batch; a worker delivers the full batch to the sink, here files. There is no database in the Gateway.</desc>
  <!-- The Gateway's flow, the same as the YAML beside it. The 202 leaves
       from Receive, before the batch: the request never waits for the
       sink. No database is drawn because there is none.
       Sinks that exist: gateway/sink.

       Generated by bravis-work/spikes/site-flows/make_flow.py; checked by
       check_flow.py. Text on the figure is names and code only: the
       sentences are in the HTML beside it, in both languages. Palette fixed:
       an <img> inherits no page CSS. -->
