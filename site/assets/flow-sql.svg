  <title id="flow-sql-t">SQL: plain files, built in dependency order</title>
  <desc id="flow-sql-d">brevis-sql reads raw.orders, a table the SDK or the Gateway landed. The model staging.stg_orders becomes a view over it, and marts.orders a table over that view; the order comes from reading the SQL. The same models build on Postgres or BigQuery.</desc>
